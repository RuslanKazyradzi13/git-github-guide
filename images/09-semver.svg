<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Семантическое версионирование MAJOR.MINOR.PATCH с примерами"><title>Семантическое версионирование MAJOR.MINOR.PATCH с примерами</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Семантическое версионирование</text><text x="40" y="84" font-size="15" fill="#5F6368">Номер версии MAJOR.MINOR.PATCH сообщает пользователю, насколько рискованно обновление.</text><text x="250" y="196" font-size="72" fill="#D93025" text-anchor="middle">2</text><text x="250" y="232" font-size="14" fill="#A50E0E" font-weight="600" text-anchor="middle" letter-spacing="1.5">MAJOR</text><text x="250" y="254" font-size="14" fill="#5F6368" text-anchor="middle">несовместимые изменения</text><text x="480" y="196" font-size="72" fill="#1A73E8" text-anchor="middle">4</text><text x="480" y="232" font-size="14" fill="#174EA6" font-weight="600" text-anchor="middle" letter-spacing="1.5">MINOR</text><text x="480" y="254" font-size="14" fill="#5F6368" text-anchor="middle">новые возможности</text><text x="710" y="196" font-size="72" fill="#1E8E3E" text-anchor="middle">1</text><text x="710" y="232" font-size="14" fill="#0D652D" font-weight="600" text-anchor="middle" letter-spacing="1.5">PATCH</text><text x="710" y="254" font-size="14" fill="#5F6368" text-anchor="middle">исправления ошибок</text><text x="365" y="190" font-size="60" fill="#9AA0A6" text-anchor="middle">.</text><text x="595" y="190" font-size="60" fill="#9AA0A6" text-anchor="middle">.</text><rect x="40" y="296" width="280" height="74" rx="12" fill="#E6F4EA"/><text class="m" x="60" y="326" font-size="16" fill="#0D652D" font-weight="600">1.4.2 → 1.4.3</text><text x="60" y="352" font-size="14" fill="#202124">исправили ошибку</text><rect x="340" y="296" width="280" height="74" rx="12" fill="#E8F0FE"/><text class="m" x="360" y="326" font-size="16" fill="#174EA6" font-weight="600">1.4.2 → 1.5.0</text><text x="360" y="352" font-size="14" fill="#202124">добавили функцию</text><rect x="640" y="296" width="280" height="74" rx="12" fill="#FCE8E6"/><text class="m" x="660" y="326" font-size="16" fill="#A50E0E" font-weight="600">1.4.2 → 2.0.0</text><text x="660" y="352" font-size="14" fill="#202124">старый код может сломаться</text><text x="40" y="412" font-size="14" fill="#202124"><tspan class="m">0.y.z</tspan> — начальная разработка: что угодно может измениться.  <tspan class="m">1.0.0</tspan> — первая стабильная версия.</text><text x="40" y="440" font-size="14" fill="#5F6368">В Git версию отмечают тегом: <tspan class="m">v1.4.3</tspan>. Буква v — соглашение, а не часть номера версии.</text></svg>
