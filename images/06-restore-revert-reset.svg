<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Сравнение команд git restore, git revert и git reset"><title>Сравнение команд git restore, git revert и git reset</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="559" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">restore, revert и reset: в чём разница</text><text x="40" y="84" font-size="15" fill="#5F6368">Три команды отменяют разное. Перед выбором ответьте: изменения уже в коммите? Коммит уже на GitHub?</text><rect x="40" y="124" width="280" height="410" rx="14" fill="#E8F0FE"/><text class="m" x="60" y="160" font-size="20" fill="#174EA6" font-weight="600">git restore</text><text x="60" y="186" font-size="14" fill="#202124" font-weight="500">Отменяет правки в файлах</text><rect x="56" y="202" width="248" height="90" rx="10" fill="#FFFFFF"/><text x="60" y="322" font-size="12.5" fill="#5F6368" font-weight="500">Что меняет</text><text x="60" y="342" font-size="14" fill="#202124">файлы в рабочей папке или staging</text><text x="60" y="376.3" font-size="12.5" fill="#5F6368" font-weight="500">История</text><text x="60" y="396.3" font-size="14" fill="#202124">не меняется</text><text x="60" y="430.6" font-size="12.5" fill="#5F6368" font-weight="500">Когда</text><text x="60" y="450.6" font-size="14" fill="#202124">правки ещё не закоммичены</text><rect x="340" y="124" width="280" height="410" rx="14" fill="#E6F4EA"/><text class="m" x="360" y="160" font-size="20" fill="#0D652D" font-weight="600">git revert</text><text x="360" y="186" font-size="14" fill="#202124" font-weight="500">Отменяет коммит новым коммитом</text><rect x="356" y="202" width="248" height="90" rx="10" fill="#FFFFFF"/><text x="360" y="322" font-size="12.5" fill="#5F6368" font-weight="500">Что меняет</text><text x="360" y="342" font-size="14" fill="#202124">добавляет коммит, обратный</text><text x="360" y="362.3" font-size="14" fill="#202124">старому</text><text x="360" y="396.6" font-size="12.5" fill="#5F6368" font-weight="500">История</text><text x="360" y="416.6" font-size="14" fill="#202124">дополняется, ничего не стирается</text><text x="360" y="450.9" font-size="12.5" fill="#5F6368" font-weight="500">Когда</text><text x="360" y="470.9" font-size="14" fill="#202124">коммит уже на GitHub</text><rect x="640" y="124" width="280" height="410" rx="14" fill="#FCE8E6"/><text class="m" x="660" y="160" font-size="20" fill="#A50E0E" font-weight="600">git reset</text><text x="660" y="186" font-size="14" fill="#202124" font-weight="500">Переносит ветку назад</text><rect x="656" y="202" width="248" height="90" rx="10" fill="#FFFFFF"/><text x="660" y="322" font-size="12.5" fill="#5F6368" font-weight="500">Что меняет</text><text x="660" y="342" font-size="14" fill="#202124">положение ветки, иногда файлы</text><text x="660" y="376.3" font-size="12.5" fill="#5F6368" font-weight="500">История</text><text x="660" y="396.3" font-size="14" fill="#202124">переписывается</text><text x="660" y="430.6" font-size="12.5" fill="#5F6368" font-weight="500">Когда</text><text x="660" y="450.6" font-size="14" fill="#202124">только неотправленные коммиты</text><text x="660" y="488.9" font-size="13" fill="#A50E0E">⚠ <tspan class="m">--hard</tspan> удаляет незакоммиченные</text><text x="660" y="507.75" font-size="13" fill="#A50E0E">правки</text><rect x="70" y="218" width="44" height="54" rx="4" fill="#FFFFFF" stroke="#F9AB00" stroke-width="1.5"/><line x1="79" y1="234" x2="105" y2="234" stroke="#DADCE0" stroke-width="2"/><line x1="79" y1="244" x2="105" y2="244" stroke="#DADCE0" stroke-width="2"/><line x1="79" y1="254" x2="105" y2="254" stroke="#DADCE0" stroke-width="2"/><text x="92" y="286" font-size="11.5" fill="#5F6368" text-anchor="middle">сейчас</text><rect x="200" y="218" width="44" height="54" rx="4" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="1.5"/><line x1="209" y1="234" x2="235" y2="234" stroke="#DADCE0" stroke-width="2"/><line x1="209" y1="244" x2="235" y2="244" stroke="#DADCE0" stroke-width="2"/><line x1="209" y1="254" x2="235" y2="254" stroke="#DADCE0" stroke-width="2"/><text x="222" y="286" font-size="11.5" fill="#5F6368" text-anchor="middle">в коммите</text><path d="M196,245 L120,245" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><line x1="370" y1="246" x2="556" y2="246" stroke="#1E8E3E" stroke-width="2.5"/><circle cx="370" cy="246" r="10" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="2.5"/><text x="370" y="228" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle">A</text><circle cx="430" cy="246" r="10" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="2.5"/><text x="430" y="228" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle">B</text><circle cx="490" cy="246" r="10" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="2.5"/><text x="490" y="228" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle">C</text><circle cx="556" cy="246" r="11" fill="#1E8E3E" stroke="#1E8E3E" stroke-width="2.5"/><text x="556" y="228" font-size="12.5" fill="#0D652D" font-weight="600" text-anchor="middle">−C</text><text x="556" y="280" font-size="11.5" fill="#0D652D" text-anchor="middle">отмена C</text><line x1="670" y1="246" x2="790" y2="246" stroke="#D93025" stroke-width="2.5"/><line x1="790" y1="246" x2="850" y2="246" stroke="#DADCE0" stroke-width="2.5" stroke-dasharray="4 4"/><circle cx="670" cy="246" r="10" fill="#FFFFFF" stroke="#D93025" stroke-width="2.5"/><text x="670" y="228" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle">A</text><circle cx="730" cy="246" r="10" fill="#FFFFFF" stroke="#D93025" stroke-width="2.5"/><text x="730" y="228" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle">B</text><circle cx="790" cy="246" r="10" fill="#FFFFFF" stroke="#D93025" stroke-width="2.5"/><text x="790" y="228" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle">C</text><circle cx="850" cy="246" r="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2.5"/><text x="850" y="228" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle"></text><text x="850" y="228" font-size="12.5" fill="#9AA0A6" font-weight="600" text-anchor="middle">D</text><path d="M790,284 L790,262" fill="none" stroke="#D93025" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-red)"/><text class="m" x="808" y="282" font-size="12" fill="#A50E0E" font-weight="600">main</text></svg>
