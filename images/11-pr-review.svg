<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Процесс Pull Request и проверки кода с правилами защиты ветки"><title>Процесс Pull Request и проверки кода с правилами защиты ветки</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="599" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Pull Request и проверка кода</text><text x="40" y="84" font-size="15" fill="#5F6368">Правила ветки main не дают слить изменения, пока не пройдены проверки и не получено одобрение.</text><rect x="40" y="184" width="190" height="84" rx="12" fill="#E8F0FE"/><text x="58" y="214.8" font-size="16" fill="#174EA6" font-weight="600">Автор</text><text x="58" y="241.6" font-size="13.5" fill="#202124">ветка, коммиты, push</text><rect x="270" y="184" width="190" height="84" rx="12" fill="#E8F0FE"/><text x="288" y="214.8" font-size="16" fill="#174EA6" font-weight="600">Pull Request</text><text x="288" y="241.6" font-size="13.5" fill="#202124">описание по шаблону</text><rect x="500" y="184" width="190" height="84" rx="12" fill="#F1F3F4"/><text x="518" y="214.8" font-size="16" fill="#3C4043" font-weight="600">CI</text><text x="518" y="241.6" font-size="13.5" fill="#202124">автоматические</text><text x="518" y="261.175" font-size="13.5" fill="#202124">проверки</text><rect x="730" y="184" width="190" height="84" rx="12" fill="#F3E8FD"/><text x="748" y="214.8" font-size="16" fill="#681DA8" font-weight="600">Ревьюер</text><text x="748" y="241.6" font-size="13.5" fill="#202124">читает Files changed</text><path d="M234,226 L266,226" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M464,226 L496,226" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M694,226 L726,226" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M790,184 C790,132 135,132 135,180" fill="none" stroke="#F9AB00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#ah-yellow)"/><text x="462" y="134" font-size="13.5" fill="#9A5B00" text-anchor="middle">Request changes → новые коммиты в ту же ветку</text><path d="M595,272 C595,324 135,324 135,276" fill="none" stroke="#D93025" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#ah-red)"/><text x="365" y="330" font-size="13" fill="#A50E0E" text-anchor="middle">проверка не прошла → исправить</text><path d="M825,272 V334" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><text x="838" y="308" font-size="13.5" fill="#0D652D" font-weight="600">Approve</text><rect x="560" y="338" width="360" height="120" rx="14" fill="#E6F4EA"/><text x="580" y="370" font-size="16" fill="#0D652D" font-weight="600">Правила ветки main</text><text x="580" y="398" font-size="14" fill="#202124">✓ обязательные проверки пройдены</text><text x="580" y="420" font-size="14" fill="#202124">✓ есть одобрение ревьюера</text><text x="580" y="442" font-size="14" fill="#202124">✓ нет конфликтов с main</text><path d="M740,462 V494" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="560" y="498" width="360" height="60" rx="12" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="1.5"/><text x="740" y="528.8" font-size="16" fill="#0D652D" font-weight="600" text-anchor="middle">Merge → удалить ветку</text><text x="40" y="398" font-size="14" fill="#5F6368">Ревью — это чтение изменений другим человеком. Он задаёт</text><text x="40" y="418.3" font-size="14" fill="#5F6368">вопросы, находит ошибки и одобряет (Approve) или просит</text><text x="40" y="438.6" font-size="14" fill="#5F6368">доработать (Request changes).</text></svg>
