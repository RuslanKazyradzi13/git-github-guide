 fill="#202124">Мой первый репозиторий.</text><circle cx="647" cy="145" r="11" fill="#1A73E8"/><text x="647" y="149.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="668" y="150" font-size="14" fill="#202124">Вкладки: код, задачи (Issues), Pull</text><text x="668" y="170.3" font-size="14" fill="#202124">Request, автоматизация (Actions),</text><text x="668" y="190.6" font-size="14" fill="#202124">настройки.</text><circle cx="647" cy="219.9" r="11" fill="#1A73E8"/><text x="647" y="224.4" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><text x="668" y="224.9" font-size="14" fill="#202124">Текущая ветка. Нажмите, чтобы</text><text x="668" y="245.2" font-size="14" fill="#202124">переключиться на другую.</text><circle cx="647" cy="274.5" r="11" fill="#1A73E8"/><text x="647" y="279" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="668" y="279.5" font-size="14" fill="#202124">Add file: создать новый файл или</text><text x="668" y="299.8" font-size="14" fill="#202124">загрузить файлы с компьютера.</text><circle cx="647" cy="329.1" r="11" fill="#1A73E8"/><text x="647" y="333.6" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="668" y="334.1" font-size="14" fill="#202124">Code: адрес для git clone и</text><text x="668" y="354.4" font-size="14" fill="#202124">скачивание архива (Download ZIP).</text><circle cx="647" cy="383.7" r="11" fill="#1A73E8"/><text x="647" y="388.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text><text x="668" y="388.7" font-size="14" fill="#202124">Число коммитов. Ссылка ведёт в</text><text x="668" y="409" font-size="14" fill="#202124">историю изменений.</text></svg>
