<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Схема: как связаны вы, Git на компьютере и GitHub"><title>Схема: как связаны вы, Git на компьютере и GitHub</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Как связаны вы, Git и GitHub</text><text x="40" y="84" font-size="15" fill="#5F6368">Вы меняете файлы, Git сохраняет версии, GitHub хранит копию в интернете.</text><rect x="30" y="118" width="580" height="262" rx="16" fill="none" stroke="#DADCE0" stroke-width="1.5" stroke-dasharray="6 6"/><text x="52" y="146" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">ВАШ КОМПЬЮТЕР</text><rect x="690" y="118" width="240" height="262" rx="16" fill="none" stroke="#DADCE0" stroke-width="1.5" stroke-dasharray="6 6"/><text x="712" y="146" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">ИНТЕРНЕТ</text><rect x="52" y="166" width="210" height="190" rx="12" fill="#FEF7E0"/><text x="70" y="197.6" font-size="17" fill="#9A5B00" font-weight="600">Рабочая папка</text><text x="70" y="225.7" font-size="14.5" fill="#202124">Обычная папка с</text><text x="70" y="246.725" font-size="14.5" fill="#202124">файлами. Вы</text><text x="70" y="267.75" font-size="14.5" fill="#202124">редактируете их сами</text><text x="70" y="288.775" font-size="14.5" fill="#202124">или с помощью AI.</text><rect x="380" y="166" width="210" height="190" rx="12" fill="#E8F0FE"/><text x="398" y="197.6" font-size="17" fill="#174EA6" font-weight="600">Локальный</text><text x="398" y="219.7" font-size="17" fill="#174EA6" font-weight="600">репозиторий</text><text class="m" x="398" y="243.8" font-size="13" fill="#5F6368">папка .git</text><text x="398" y="271.8" font-size="14.5" fill="#202124">Хранит историю всех</text><text x="398" y="292.825" font-size="14.5" fill="#202124">сохранённых версий.</text><rect x="710" y="166" width="200" height="190" rx="12" fill="#E6F4EA"/><text x="728" y="197.6" font-size="17" fill="#0D652D" font-weight="600">GitHub</text><text class="m" x="728" y="221.7" font-size="13" fill="#5F6368">удалённый репозиторий</text><text x="728" y="249.7" font-size="14.5" fill="#202124">Копия проекта в</text><text x="728" y="270.725" font-size="14.5" fill="#202124">интернете. Доступна</text><text x="728" y="291.75" font-size="14.5" fill="#202124">вам и команде.</text><text class="m" x="321" y="226" font-size="14" fill="#174EA6" text-anchor="middle">git add</text><text class="m" x="321" y="246" font-size="14" fill="#174EA6" text-anchor="middle">git commit</text><path d="M266,262 L374,262" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="321" y="286" font-size="12.5" fill="#5F6368" text-anchor="middle">сохранить версию</text><path d="M594,236 L704,236" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="605.6" y="223" width="86.8" height="26" rx="13" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.2"/><text class="m" x="649" y="240.86" font-size="13.5" fill="#174EA6" text-anchor="middle">git push</text><path d="M704,300 L594,300" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="605.6" y="287" width="86.8" height="26" rx="13" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="1.2"/><text class="m" x="649" y="304.86" font-size="13.5" fill="#0D652D" text-anchor="middle">git pull</text><text x="480" y="424" font-size="14" fill="#5F6368" text-anchor="middle">Всё, что слева, работает без интернета. Интернет нужен только для обмена с GitHub.</text></svg>
