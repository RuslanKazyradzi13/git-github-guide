<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Порядок действий, если секрет попал в Git-репозиторий"><title>Порядок действий, если секрет попал в Git-репозиторий</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="599" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Секрет попал в репозиторий: что делать</text><text x="40" y="84" font-size="15" fill="#5F6368">Сначала обезвредьте секрет, потом чистите историю. Порядок важен.</text><circle cx="58" cy="150" r="15" fill="#D93025"/><text x="58" y="155" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="88" y="148" font-size="16" fill="#202124" font-weight="600">Отзовите или замените секрет</text><text x="88" y="172" font-size="13.5" fill="#5F6368">Смените ключ, токен или пароль у поставщика. Это главное действие.</text><line x1="58" y1="168" x2="58" y2="194" stroke="#DADCE0" stroke-width="2"/><circle cx="58" cy="222" r="15" fill="#D93025"/><text x="58" y="227" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><text x="88" y="220" font-size="16" fill="#202124" font-weight="600">Оцените последствия</text><text x="88" y="244" font-size="13.5" fill="#5F6368">Проверьте журналы доступа: пользовался ли кто-то ключом.</text><line x1="58" y1="240" x2="58" y2="266" stroke="#DADCE0" stroke-width="2"/><circle cx="58" cy="294" r="15" fill="#F9AB00"/><text x="58" y="299" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="88" y="292" font-size="16" fill="#202124" font-weight="600">Уберите секрет из кода</text><text x="88" y="316" font-size="13.5" fill="#5F6368">Перенесите его в .env или секреты GitHub, добавьте .env в .gitignore.</text><line x1="58" y1="312" x2="58" y2="338" stroke="#DADCE0" stroke-width="2"/><circle cx="58" cy="366" r="15" fill="#F9AB00"/><text x="58" y="371" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="88" y="364" font-size="16" fill="#202124" font-weight="600">Решите, чистить ли историю</text><text x="88" y="388" font-size="13.5" fill="#5F6368">git filter-repo переписывает историю. Согласуйте с командой.</text><line x1="58" y1="384" x2="58" y2="410" stroke="#DADCE0" stroke-width="2"/><circle cx="58" cy="438" r="15" fill="#5F6368"/><text x="58" y="443" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text><text x="88" y="436" font-size="16" fill="#202124" font-weight="600">Обратитесь в поддержку GitHub</text><text x="88" y="460" font-size="13.5" fill="#5F6368">Если нужно убрать кэшированные представления и ссылки PR.</text><line x1="58" y1="456" x2="58" y2="482" stroke="#DADCE0" stroke-width="2"/><circle cx="58" cy="510" r="15" fill="#1E8E3E"/><text x="58" y="515" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text><text x="88" y="508" font-size="16" fill="#202124" font-weight="600">Предотвратите повтор</text><text x="88" y="532" font-size="13.5" fill="#5F6368">Push protection, проверка diff, .env.example вместо .env.</text><rect x="620" y="128" width="300" height="250" rx="14" fill="#FCE8E6"/><text x="642" y="162" font-size="16" fill="#A50E0E" font-weight="600">Важно</text><text x="642" y="192" font-size="14" fill="#202124">Удаление файла новым коммитом не</text><text x="642" y="212.3" font-size="14" fill="#202124">убирает секрет из истории. Его</text><text x="642" y="232.6" font-size="14" fill="#202124">можно найти в старых коммитах,</text><text x="642" y="252.9" font-size="14" fill="#202124">клонах и форках.</text><text x="642" y="300" font-size="14" fill="#A50E0E">Считайте опубликованный секрет</text><text x="642" y="320.3" font-size="14" fill="#A50E0E">скомпрометированным, даже если</text><text x="642" y="340.6" font-size="14" fill="#A50E0E">удалили его быстро.</text></svg>
