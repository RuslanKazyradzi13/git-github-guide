<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-label="Схема выбора лицензии для проекта"><title>Схема выбора лицензии для проекта</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="759" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Как выбрать лицензию</text><text x="40" y="84" font-size="15" fill="#5F6368">Схема помогает сузить выбор. Это учебный материал, а не юридическая консультация.</text><rect x="300" y="120" width="360" height="70" rx="12" fill="#F1F3F4"/><text x="480" y="146.4" font-size="15.5" fill="#3C4043" font-weight="600" text-anchor="middle">Права на весь код принадлежат вам?</text><text x="480" y="172.55" font-size="13" fill="#202124" text-anchor="middle">свой код, договор с работодателем, соавторы</text><rect x="720" y="120" width="200" height="110" rx="12" fill="#FCE8E6"/><text x="734" y="145.6" font-size="14.5" fill="#A50E0E" font-weight="600">Сначала выясните</text><text x="734" y="164.45" font-size="14.5" fill="#A50E0E" font-weight="600">права</text><text x="734" y="189.3" font-size="13" fill="#202124">Работодатель, соавторы,</text><text x="734" y="208.15" font-size="13" fill="#202124">чужой код и зависимости.</text><path d="M664,150 L716,150" fill="none" stroke="#D93025" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-red)"/><text x="690" y="140" font-size="12.5" fill="#A50E0E" text-anchor="middle">нет</text><path d="M480,194 L480,236" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><text x="492" y="220" font-size="12.5" fill="#5F6368">да</text><rect x="330" y="240" width="300" height="52" rx="12" fill="#F1F3F4"/><text x="480" y="266.4" font-size="15.5" fill="#3C4043" font-weight="600" text-anchor="middle">Чего вы хотите от лицензии?</text><rect x="40" y="340" width="280" height="70" rx="12" fill="#E6F4EA"/><text x="56" y="369.6" font-size="14.5" fill="#0D652D">Чтобы кодом пользовались</text><text x="56" y="390.625" font-size="14.5" fill="#0D652D">максимально широко</text><rect x="340" y="340" width="280" height="70" rx="12" fill="#E8F0FE"/><text x="356" y="369.6" font-size="14.5" fill="#174EA6">Чтобы изменённые версии тоже</text><text x="356" y="390.625" font-size="14.5" fill="#174EA6">оставались открытыми</text><rect x="640" y="340" width="280" height="70" rx="12" fill="#FEF7E0"/><text x="656" y="369.6" font-size="14.5" fill="#9A5B00">Чтобы мой код без разрешения не</text><text x="656" y="390.625" font-size="14.5" fill="#9A5B00">использовали</text><path d="M400,296 C400,318 180,318 180,336" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M480,296 L480,336" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M560,296 C560,318 780,318 780,336" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M180,414 L180,446" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M480,414 L480,446" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M780,414 L780,446" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="40" y="450" width="280" height="210" rx="12" fill="#E6F4EA"/><text x="58" y="480" font-size="15" fill="#0D652D" font-weight="600">Разрешительные лицензии</text><text class="m" x="58" y="510" font-size="14" fill="#202124" font-weight="600">MIT</text><text x="58" y="530" font-size="13" fill="#5F6368">короткая и простая</text><text class="m" x="58" y="558" font-size="14" fill="#202124" font-weight="600">BSD-2/3-Clause</text><text x="58" y="578" font-size="13" fill="#5F6368">похожа на MIT</text><text class="m" x="58" y="606" font-size="14" fill="#202124" font-weight="600">Apache-2.0</text><text x="58" y="626" font-size="13" fill="#5F6368">явная патентная лицензия, NOTICE</text><rect x="340" y="450" width="280" height="210" rx="12" fill="#E8F0FE"/><text x="358" y="480" font-size="15" fill="#174EA6" font-weight="600">Copyleft-лицензии</text><text class="m" x="358" y="510" font-size="14" fill="#202124" font-weight="600">MPL-2.0</text><text x="358" y="528" font-size="12.5" fill="#5F6368">открывать изменённые файлы</text><text class="m" x="358" y="548" font-size="14" fill="#202124" font-weight="600">LGPL-3.0</text><text x="358" y="566" font-size="12.5" fill="#5F6368">для библиотек</text><text class="m" x="358" y="586" font-size="14" fill="#202124" font-weight="600">GPL-3.0</text><text x="358" y="604" font-size="12.5" fill="#5F6368">вся программа при распространении</text><text class="m" x="358" y="624" font-size="14" fill="#202124" font-weight="600">AGPL-3.0</text><text x="358" y="642" font-size="12.5" fill="#5F6368">+ пользователи сетевого сервиса</text><rect x="640" y="450" width="280" height="210" rx="12" fill="#FEF7E0"/><text x="658" y="480" font-size="15" fill="#9A5B00" font-weight="600">Открытая лицензия не подходит</text><text x="658" y="510" font-size="13.5" fill="#202124">Не публикуйте код или обсудите</text><text x="658" y="529.575" font-size="13.5" fill="#202124">модель лицензирования с юристом.</text><text x="658" y="549.15" font-size="13.5" fill="#202124">Отсутствие лицензии в публичном</text><text x="658" y="568.725" font-size="13.5" fill="#202124">репозитории — не стратегия защиты.</text><text x="40" y="700" font-size="14" fill="#202124">Перед выбором проверьте лицензии зависимостей: они могут ограничить ваш выбор.</text><text x="40" y="726" font-size="13.5" fill="#5F6368">Подробности и сравнение — в главе 10 и в templates/LICENSE_SELECTION_GUIDE.md.</text></svg>
