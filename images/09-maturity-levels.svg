<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="Инфографика трёх уровней зрелости репозитория"><title>Инфографика трёх уровней зрелости репозитория</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="619" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Уровни зрелости репозитория</text><text x="40" y="84" font-size="15" fill="#5F6368">Каждый уровень включает требования предыдущего. Выберите уровень по назначению проекта.</text><rect x="40" y="350" width="280" height="230" rx="14" fill="#E6F4EA"/><text x="60" y="386" font-size="18" fill="#0D652D" font-weight="600">1. Базовый</text><text x="60" y="408" font-size="13" fill="#5F6368">личный или учебный проект</text><text x="60" y="442" font-size="14" fill="#1E8E3E" font-weight="600">✓</text><text x="80" y="442" font-size="14" fill="#202124">README.md</text><text x="60" y="468" font-size="14" fill="#1E8E3E" font-weight="600">✓</text><text x="80" y="468" font-size="14" fill="#202124">.gitignore</text><text x="60" y="494" font-size="14" fill="#1E8E3E" font-weight="600">✓</text><text x="80" y="494" font-size="14" fill="#202124">LICENSE, если код публичный</text><text x="60" y="520" font-size="14" fill="#1E8E3E" font-weight="600">✓</text><text x="80" y="520" font-size="14" fill="#202124">Понятные коммиты</text><text x="60" y="546" font-size="14" fill="#1E8E3E" font-weight="600">✓</text><text x="80" y="546" font-size="14" fill="#202124">Нет секретов в коде</text><rect x="340" y="230" width="280" height="350" rx="14" fill="#E8F0FE"/><text x="360" y="266" font-size="18" fill="#174EA6" font-weight="600">2. Профессиональный</text><text x="360" y="288" font-size="13" fill="#5F6368">проект для работы и заказчиков</text><text x="360" y="322" font-size="13" fill="#174EA6" font-weight="500">+ всё с уровня 1</text><text x="360" y="350" font-size="14" fill="#1A73E8" font-weight="600">✓</text><text x="380" y="350" font-size="14" fill="#202124">Тесты и CI</text><text x="360" y="376" font-size="14" fill="#1A73E8" font-weight="600">✓</text><text x="380" y="376" font-size="14" fill="#202124">CHANGELOG и теги версий</text><text x="360" y="402" font-size="14" fill="#1A73E8" font-weight="600">✓</text><text x="380" y="402" font-size="14" fill="#202124">.editorconfig, .gitattributes</text><text x="360" y="428" font-size="14" fill="#1A73E8" font-weight="600">✓</text><text x="380" y="428" font-size="14" fill="#202124">Защита ветки main</text><text x="360" y="454" font-size="14" fill="#1A73E8" font-weight="600">✓</text><text x="380" y="454" font-size="14" fill="#202124">Dependabot</text><text x="360" y="480" font-size="14" fill="#1A73E8" font-weight="600">✓</text><text x="380" y="480" font-size="14" fill="#202124">CONTRIBUTING, SECURITY</text><text x="360" y="506" font-size="14" fill="#1A73E8" font-weight="600">✓</text><text x="380" y="506" font-size="14" fill="#202124">Лицензии зависимостей</text><rect x="640" y="130" width="280" height="450" rx="14" fill="#F3E8FD"/><text x="660" y="166" font-size="18" fill="#681DA8" font-weight="600">3. Open-source</text><text x="660" y="188" font-size="13" fill="#5F6368">публичный проект для сообщества</text><text x="660" y="222" font-size="13" fill="#681DA8" font-weight="500">+ всё с уровня 2</text><text x="660" y="250" font-size="14" fill="#9334E6" font-weight="600">✓</text><text x="680" y="250" font-size="14" fill="#202124">CODE_OF_CONDUCT.md</text><text x="660" y="276" font-size="14" fill="#9334E6" font-weight="600">✓</text><text x="680" y="276" font-size="14" fill="#202124">Шаблоны Issue</text><text x="660" y="302" font-size="14" fill="#9334E6" font-weight="600">✓</text><text x="680" y="302" font-size="14" fill="#202124">Закрытые сообщения</text><text x="680" y="328" font-size="14" fill="#202124">об уязвимостях</text><text x="660" y="354" font-size="14" fill="#9334E6" font-weight="600">✓</text><text x="680" y="354" font-size="14" fill="#202124">Secret scanning, CodeQL</text><text x="660" y="380" font-size="14" fill="#9334E6" font-weight="600">✓</text><text x="680" y="380" font-size="14" fill="#202124">Проверка Scorecard</text><text x="660" y="406" font-size="14" fill="#9334E6" font-weight="600">✓</text><text x="680" y="406" font-size="14" fill="#202124">SPDX, сторонние компоненты</text></svg>
