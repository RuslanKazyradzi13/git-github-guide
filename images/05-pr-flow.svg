<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Схема работы через Pull Request: ветка, изменения, коммит, push, Pull Request, проверка, слияние"><title>Схема работы через Pull Request: ветка, изменения, коммит, push, Pull Request, проверка, слияние</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="479" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Путь изменения через Pull Request</text><text x="40" y="84" font-size="15" fill="#5F6368">Pull Request — запрос на слияние. Изменения проверяют до того, как они попадут в main.</text><rect x="40" y="124" width="197" height="92" rx="12" fill="#E8F0FE"/><circle cx="68" cy="154" r="13" fill="#1A73E8"/><text x="68" y="159" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="90" y="159" font-size="16" fill="#174EA6" font-weight="600">Новая ветка</text><text class="m" x="58" y="194" font-size="13" fill="#202124">git switch -c имя</text><rect x="267" y="124" width="197" height="92" rx="12" fill="#E8F0FE"/><circle cx="295" cy="154" r="13" fill="#1A73E8"/><text x="295" y="159" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><text x="317" y="159" font-size="16" fill="#174EA6" font-weight="600">Изменения</text><text x="285" y="194" font-size="13.5" fill="#5F6368">правка файлов</text><rect x="494" y="124" width="197" height="92" rx="12" fill="#E8F0FE"/><circle cx="522" cy="154" r="13" fill="#1A73E8"/><text x="522" y="159" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="544" y="159" font-size="16" fill="#174EA6" font-weight="600">Коммит</text><text class="m" x="512" y="194" font-size="13" fill="#202124">git commit</text><rect x="721" y="124" width="197" height="92" rx="12" fill="#E8F0FE"/><circle cx="749" cy="154" r="13" fill="#1A73E8"/><text x="749" y="159" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="771" y="159" font-size="16" fill="#174EA6" font-weight="600">Отправка</text><text class="m" x="739" y="194" font-size="13" fill="#202124">git push</text><rect x="721" y="290" width="197" height="92" rx="12" fill="#E6F4EA"/><circle cx="749" cy="320" r="13" fill="#1E8E3E"/><text x="749" y="325" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text><text x="771" y="325" font-size="16" fill="#0D652D" font-weight="600">Pull Request</text><text x="739" y="360" font-size="13.5" fill="#5F6368">открыть на GitHub</text><rect x="494" y="290" width="197" height="92" rx="12" fill="#E6F4EA"/><circle cx="522" cy="320" r="13" fill="#1E8E3E"/><text x="522" y="325" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text><text x="544" y="325" font-size="16" fill="#0D652D" font-weight="600">Проверка</text><text x="512" y="360" font-size="13.5" fill="#5F6368">ревью и автопроверки</text><rect x="267" y="290" width="197" height="92" rx="12" fill="#E6F4EA"/><circle cx="295" cy="320" r="13" fill="#1E8E3E"/><text x="295" y="325" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">7</text><text x="317" y="325" font-size="16" fill="#0D652D" font-weight="600">Слияние</text><text x="285" y="360" font-size="13.5" fill="#5F6368">Merge pull request</text><rect x="40" y="290" width="197" height="92" rx="12" fill="#E8F0FE"/><circle cx="68" cy="320" r="13" fill="#1A73E8"/><text x="68" y="325" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">8</text><text x="90" y="325" font-size="16" fill="#174EA6" font-weight="600">Обновление</text><text x="58" y="360" font-size="13.5" fill="#202124"><tspan class="m">git pull</tspan> в main</text><path d="M240,170 L264,170" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M264,336 L240,336" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><path d="M467,170 L491,170" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M491,336 L467,336" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><path d="M694,170 L718,170" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M718,336 L694,336" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><path d="M819.5,220 V286" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M554,288 C534,252 417,252 407,220" fill="none" stroke="#F9AB00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#ah-yellow)"/><text x="560" y="262" font-size="12.5" fill="#9A5B00">нужны правки</text><rect x="40" y="418" width="14" height="14" rx="3" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/><text x="62" y="430" font-size="13.5" fill="#5F6368">на вашем компьютере</text><rect x="250" y="418" width="14" height="14" rx="3" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1"/><text x="272" y="430" font-size="13.5" fill="#5F6368">на сайте GitHub</text></svg>
