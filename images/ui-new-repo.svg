<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Схема формы создания репозитория на GitHub (не скриншот)"><title>Схема формы создания репозитория на GitHub (не скриншот)</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="639" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Создание репозитория на GitHub</text><text x="40" y="84" font-size="15" fill="#5F6368">Кнопка + в правом верхнем углу → New repository.</text><rect x="698.25" y="35" width="221.75" height="26" rx="13" fill="#FEF7E0"/><text x="809.125" y="52.5" font-size="12.5" fill="#9A5B00" font-weight="600" text-anchor="middle">Схема интерфейса · не скриншот</text><rect x="40" y="112" width="560" height="500" rx="12" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.2"/><rect x="40.6" y="112.6" width="558.8" height="36" rx="11.5" fill="#F1F3F4"/><rect x="40.6" y="136" width="558.8" height="13" rx="0" fill="#F1F3F4"/><circle cx="58" cy="130" r="4.5" fill="#DADCE0"/><circle cx="72" cy="130" r="4.5" fill="#DADCE0"/><circle cx="86" cy="130" r="4.5" fill="#DADCE0"/><rect x="110" y="120" width="470" height="20" rx="10" fill="#FFFFFF"/><text x="124" y="134.5" font-size="12" fill="#5F6368">github.com/new</text><text x="64" y="184" font-size="18" fill="#202124" font-weight="600">Create a new repository</text><text x="64" y="214" font-size="12.5" fill="#5F6368" font-weight="500">Owner</text><rect x="64" y="222" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="74" y="241.5" font-size="13" fill="#202124">ivan-petrov  ▾</text><text x="236" y="243" font-size="18" fill="#5F6368">/</text><text x="256" y="214" font-size="12.5" fill="#5F6368" font-weight="500">Repository name</text><rect x="256" y="222" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="266" y="241.5" font-size="13" fill="#202124">my-first-repo</text><circle cx="578" cy="237" r="11" fill="#1A73E8"/><text x="578" y="241.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="64" y="280" font-size="12.5" fill="#5F6368" font-weight="500">Description (optional)</text><rect x="64" y="288" width="492" height="30" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="74" y="307.5" font-size="13" fill="#202124">Мой первый репозиторий</text><circle cx="578" cy="303" r="11" fill="#1A73E8"/><text x="578" y="307.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><text x="64" y="346" font-size="12.5" fill="#5F6368" font-weight="500">Visibility</text><circle cx="72" cy="370" r="6.5" fill="#FFFFFF" stroke="#1A73E8" stroke-width="4.5"/><text x="86" y="375" font-size="13.5" fill="#202124" font-weight="500">Public</text><circle cx="172" cy="370" r="6.5" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.2"/><text x="186" y="375" font-size="13.5" fill="#202124">Private</text><circle cx="578" cy="370" r="11" fill="#1A73E8"/><text x="578" y="374.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><line x1="64" y1="404" x2="556" y2="404" stroke="#EAEEF2" stroke-width="1"/><text x="64" y="430" font-size="13.5" fill="#202124" font-weight="500">README</text><rect x="516" y="416" width="40" height="20" rx="10" fill="#D0D7DE"/><circle cx="527" cy="426" r="7" fill="#FFFFFF"/><line x1="64" y1="446" x2="556" y2="446" stroke="#EAEEF2" stroke-width="1"/><text x="64" y="472" font-size="13.5" fill="#202124" font-weight="500">.gitignore</text><rect x="416" y="454" width="140" height="28" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="426" y="472.5" font-size="13" fill="#202124">None  ▾</text><line x1="64" y1="488" x2="556" y2="488" stroke="#EAEEF2" stroke-width="1"/><text x="64" y="514" font-size="13.5" fill="#202124" font-weight="500">License</text><rect x="416" y="496" width="140" height="28" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="426" y="514.5" font-size="13" fill="#202124">None  ▾</text><circle cx="578" cy="467" r="11" fill="#1A73E8"/><text x="578" y="471.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><rect x="64" y="552" width="170" height="34" rx="6" fill="#1F883D"/><text x="149" y="573.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Create repository</text><circle cx="254" cy="569" r="11" fill="#1A73E8"/><text x="254" y="573.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text><circle cx="647" cy="145" r="11" fill="#1A73E8"/><text x="647" y="149.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="668" y="150" font-size="14" fill="#202124">Владелец и имя репозитория. Имя —</text><text x="668" y="170.3" font-size="14" fill="#202124">латиницей, без пробелов.</text><circle cx="647" cy="199.6" r="11" fill="#1A73E8"/><text x="647" y="204.1" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><text x="668" y="204.6" font-size="14" fill="#202124">Описание — по желанию, одна</text><text x="668" y="224.9" font-size="14" fill="#202124">строка о проекте.</text><circle cx="647" cy="254.2" r="11" fill="#1A73E8"/><text x="647" y="258.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="668" y="259.2" font-size="14" fill="#202124">Public — видят все. Private —</text><text x="668" y="279.5" font-size="14" fill="#202124">только вы и приглашённые люди.</text><circle cx="647" cy="308.8" r="11" fill="#1A73E8"/><text x="647" y="313.3" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="668" y="313.8" font-size="14" fill="#202124">README, .gitignore и лицензия. Для</text><text x="668" y="334.1" font-size="14" fill="#202124">нового проекта их можно добавить.</text><text x="668" y="354.4" font-size="14" fill="#202124">Если загружаете готовый проект с</text><text x="668" y="374.7" font-size="14" fill="#202124">компьютера — оставьте</text><text x="668" y="395" font-size="14" fill="#202124">выключенными.</text><circle cx="647" cy="424.3" r="11" fill="#1A73E8"/><text x="647" y="428.8" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text><text x="668" y="429.3" font-size="14" fill="#202124">Создать репозиторий.</text></svg>
