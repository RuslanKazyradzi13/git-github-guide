<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Спектр лицензий от разрешительных до сильного copyleft"><title>Спектр лицензий от разрешительных до сильного copyleft</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">От разрешительных лицензий к copyleft</text><text x="40" y="84" font-size="15" fill="#5F6368">Чем правее лицензия, тем больше условий при распространении изменённых версий.</text><rect x="40" y="122" width="360" height="8" rx="4" fill="#1E8E3E"/><text x="40" y="160" font-size="17" fill="#0D652D" font-weight="600">Разрешительные</text><text class="m" x="40" y="182" font-size="12.5" fill="#5F6368">permissive</text><rect x="40" y="214" width="360" height="40" rx="10" fill="#E6F4EA"/><text class="m" x="56" y="239" font-size="15" fill="#202124" font-weight="600">MIT</text><rect x="40" y="264" width="360" height="40" rx="10" fill="#E6F4EA"/><text class="m" x="56" y="289" font-size="15" fill="#202124" font-weight="600">BSD-2-Clause</text><rect x="40" y="314" width="360" height="40" rx="10" fill="#E6F4EA"/><text class="m" x="56" y="339" font-size="15" fill="#202124" font-weight="600">BSD-3-Clause</text><rect x="40" y="364" width="360" height="50" rx="10" fill="#E6F4EA"/><text class="m" x="56" y="389" font-size="15" fill="#202124" font-weight="600">Apache-2.0</text><text x="56" y="406" font-size="12.5" fill="#5F6368">+ явная патентная лицензия</text><rect x="410" y="122" width="240" height="8" rx="4" fill="#1A73E8"/><text x="410" y="160" font-size="17" fill="#174EA6" font-weight="600">Слабый copyleft</text><text class="m" x="410" y="182" font-size="12.5" fill="#5F6368">weak copyleft</text><rect x="410" y="214" width="240" height="50" rx="10" fill="#E8F0FE"/><text class="m" x="426" y="239" font-size="15" fill="#202124" font-weight="600">MPL-2.0</text><text x="426" y="256" font-size="12.5" fill="#5F6368">условия — на уровне файла</text><rect x="410" y="274" width="240" height="50" rx="10" fill="#E8F0FE"/><text class="m" x="426" y="299" font-size="15" fill="#202124" font-weight="600">LGPL-3.0</text><text x="426" y="316" font-size="12.5" fill="#5F6368">на уровне библиотеки</text><rect x="660" y="122" width="260" height="8" rx="4" fill="#9334E6"/><text x="660" y="160" font-size="17" fill="#681DA8" font-weight="600">Сильный copyleft</text><text class="m" x="660" y="182" font-size="12.5" fill="#5F6368">strong copyleft</text><rect x="660" y="214" width="260" height="50" rx="10" fill="#F3E8FD"/><text class="m" x="676" y="239" font-size="15" fill="#202124" font-weight="600">GPL-3.0</text><text x="676" y="256" font-size="12.5" fill="#5F6368">вся программа при распространении</text><rect x="660" y="274" width="260" height="50" rx="10" fill="#F3E8FD"/><text class="m" x="676" y="299" font-size="15" fill="#202124" font-weight="600">AGPL-3.0</text><text x="676" y="316" font-size="12.5" fill="#5F6368">+ при работе по сети</text><line x1="40" y1="418" x2="920" y2="418" stroke="#DADCE0" stroke-width="1"/><text x="40" y="444" font-size="13.5" fill="#5F6368">Меньше условий для получателя кода</text><text x="920" y="444" font-size="13.5" fill="#5F6368" text-anchor="end">Больше условий для производных версий</text><path d="M320,440 L640,440" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/></svg>
