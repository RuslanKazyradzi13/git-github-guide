<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Диаграмма ветвления и слияния: ветка feature отходит от main и сливается обратно"><title>Диаграмма ветвления и слияния: ветка feature отходит от main и сливается обратно</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="479" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Ветвление и слияние</text><text x="40" y="84" font-size="15" fill="#5F6368">Ветка — отдельная линия работы. Main остаётся стабильной, пока вы пробуете новое.</text><path d="M90,196 H848" fill="none" stroke="#1A73E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M230,196 C300,196 300,312 370,312 H520 C620,312 700,196 780,196" fill="none" stroke="#1E8E3E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110" cy="196" r="11" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/><text x="110" y="168" font-size="13.5" fill="#5F6368" text-anchor="middle">Начало</text><circle cx="230" cy="196" r="11" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/><text x="230" y="168" font-size="13.5" fill="#5F6368" text-anchor="middle">Стабильная версия</text><circle cx="580" cy="196" r="11" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/><text x="580" y="168" font-size="13.5" fill="#5F6368" text-anchor="middle">Исправление в main</text><circle cx="780" cy="196" r="13" fill="#1A73E8"/><text x="780" y="168" font-size="13.5" fill="#174EA6" font-weight="600" text-anchor="middle">Слияние (merge)</text><circle cx="390" cy="312" r="11" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="3"/><text x="390" y="346" font-size="13.5" fill="#5F6368" text-anchor="middle">Коммит в ветке</text><circle cx="510" cy="312" r="11" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="3"/><text x="510" y="346" font-size="13.5" fill="#5F6368" text-anchor="middle">Ещё коммит</text><rect x="860.8" y="183" width="54.4" height="26" rx="13" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.2"/><text class="m" x="888" y="200.86" font-size="13.5" fill="#174EA6" text-anchor="middle">main</text><rect x="374.2" y="263" width="151.6" height="26" rx="13" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.2"/><text class="m" x="450" y="280.86" font-size="13.5" fill="#0D652D" text-anchor="middle">feature/contacts</text><circle cx="286" cy="246" r="11" fill="#5F6368"/><text x="286" y="251" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><circle cx="450" cy="372" r="11" fill="#5F6368"/><text x="450" y="377" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><circle cx="744" cy="258" r="11" fill="#5F6368"/><text x="744" y="263" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><circle cx="51" cy="407" r="11" fill="#5F6368"/><text x="51" y="412" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="70" y="412" font-size="13.5" fill="#202124"><tspan class="m">git switch -c feature/contacts</tspan> — создать ветку</text><circle cx="501" cy="407" r="11" fill="#5F6368"/><text x="501" y="412" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><text x="520" y="412" font-size="13.5" fill="#202124">Коммиты в ветке: <tspan class="m">git add</tspan>, <tspan class="m">git commit</tspan></text><circle cx="51" cy="441" r="11" fill="#5F6368"/><text x="51" y="446" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="70" y="446" font-size="13.5" fill="#202124"><tspan class="m">git switch main</tspan> — вернуться в main</text><circle cx="501" cy="441" r="11" fill="#5F6368"/><text x="501" y="446" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="520" y="446" font-size="13.5" fill="#202124"><tspan class="m">git merge feature/contacts</tspan> — влить в main</text></svg>
