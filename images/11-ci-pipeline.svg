<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Диаграмма автоматических проверок CI в GitHub Actions"><title>Диаграмма автоматических проверок CI в GitHub Actions</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="559" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Автоматические проверки (CI)</text><text x="40" y="84" font-size="15" fill="#5F6368">GitHub Actions запускает проверки при каждом push и Pull Request и показывает результат в PR.</text><text x="40" y="136" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">СОБЫТИЕ</text><rect x="40" y="150" width="170" height="60" rx="12" fill="#F1F3F4"/><text x="125" y="180" font-size="15" fill="#3C4043" font-weight="600" text-anchor="middle">push</text><rect x="40" y="226" width="170" height="60" rx="12" fill="#F1F3F4"/><text x="125" y="256" font-size="15" fill="#3C4043" font-weight="600" text-anchor="middle">Pull Request</text><path d="M214,180 C250,180 250,218 282,218" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M214,256 C250,256 250,226 282,226" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><text x="290" y="136" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">WORKFLOW .GITHUB/WORKFLOWS/CI.YML</text><rect x="286" y="150" width="634" height="136" rx="14" fill="#E8F0FE"/><rect x="304" y="172" width="136" height="92" rx="10" fill="#FFFFFF"/><text x="372" y="210" font-size="14" fill="#202124" font-weight="600" text-anchor="middle">Скачать код</text><text class="m" x="372" y="236" font-size="12.5" fill="#5F6368" text-anchor="middle">checkout</text><path d="M441,218 L451,218" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="452" y="172" width="136" height="92" rx="10" fill="#FFFFFF"/><text x="520" y="210" font-size="14" fill="#202124" font-weight="600" text-anchor="middle">Установить Python</text><text class="m" x="520" y="236" font-size="12.5" fill="#5F6368" text-anchor="middle">setup-python</text><path d="M589,218 L599,218" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="600" y="172" width="136" height="92" rx="10" fill="#FFFFFF"/><text x="668" y="210" font-size="14" fill="#202124" font-weight="600" text-anchor="middle">Линтер</text><text class="m" x="668" y="236" font-size="12.5" fill="#5F6368" text-anchor="middle">ruff check</text><path d="M737,218 L747,218" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="748" y="172" width="136" height="92" rx="10" fill="#FFFFFF"/><text x="816" y="210" font-size="14" fill="#202124" font-weight="600" text-anchor="middle">Тесты</text><text class="m" x="816" y="236" font-size="12.5" fill="#5F6368" text-anchor="middle">unittest</text><path d="M603,290 V318 H330 V344" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><path d="M603,318 H770 V344" fill="none" stroke="#D93025" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-red)"/><rect x="200" y="348" width="260" height="76" rx="12" fill="#E6F4EA"/><text x="218" y="378" font-size="15" fill="#0D652D" font-weight="600">✓ Все проверки пройдены</text><text x="218" y="403.5" font-size="13.5" fill="#202124">PR можно сливать</text><rect x="640" y="348" width="260" height="76" rx="12" fill="#FCE8E6"/><text x="658" y="378" font-size="15" fill="#A50E0E" font-weight="600">✗ Проверка не прошла</text><text x="658" y="403.5" font-size="13.5" fill="#202124">откройте лог и исправьте</text><text x="40" y="462" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">ВСТРОЕННЫЕ ФУНКЦИИ GITHUB · ВКЛЮЧАЮТСЯ В НАСТРОЙКАХ</text><rect x="40" y="476" width="280" height="60" rx="12" fill="#F1F3F4"/><text x="58" y="501" font-size="14.5" fill="#202124" font-weight="600">Dependabot</text><text x="58" y="523" font-size="13" fill="#5F6368">обновления и уязвимые зависимости</text><rect x="340" y="476" width="280" height="60" rx="12" fill="#F1F3F4"/><text x="358" y="501" font-size="14.5" fill="#202124" font-weight="600">Secret scanning</text><text x="358" y="523" font-size="13" fill="#5F6368">поиск ключей и токенов</text><rect x="640" y="476" width="280" height="60" rx="12" fill="#F1F3F4"/><text x="658" y="501" font-size="14.5" fill="#202124" font-weight="600">CodeQL</text><text x="658" y="523" font-size="13" fill="#5F6368">анализ кода на уязвимости</text></svg>
