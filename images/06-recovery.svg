<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-label="Таблица выбора команды для отмены изменений с оценкой риска"><title>Таблица выбора команды для отмены изменений с оценкой риска</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="659" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Как отменить изменения</text><text x="40" y="84" font-size="15" fill="#5F6368">Найдите свою ситуацию. Цвет показывает, насколько безопасна команда.</text><text x="40" y="132" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">СИТУАЦИЯ</text><text x="420" y="132" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">КОМАНДА</text><text x="770" y="132" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">РИСК</text><line x1="40" y1="146" x2="920" y2="146" stroke="#DADCE0" stroke-width="1"/><text x="40" y="174" font-size="14.5" fill="#202124">Изменили файл, git add не делали. Хотите</text><text x="40" y="195.025" font-size="14.5" fill="#202124">вернуть как было.</text><text class="m" x="420" y="174" font-size="13.5" fill="#202124">git restore &lt;файл&gt;</text><text x="420" y="196" font-size="12.5" fill="#5F6368">правки в файле будут удалены</text><rect x="770" y="159" width="124.02" height="26" rx="13" fill="#FCE8E6"/><text x="832.01" y="176.5" font-size="13" fill="#A50E0E" font-weight="600" text-anchor="middle">Удаляет правки</text><line x1="40" y1="210" x2="920" y2="210" stroke="#DADCE0" stroke-width="1"/><text x="40" y="238" font-size="14.5" fill="#202124">Сделали git add, но передумали.</text><text class="m" x="420" y="238" font-size="13.5" fill="#202124">git restore --staged &lt;файл&gt;</text><text x="420" y="260" font-size="12.5" fill="#5F6368">файл останется изменённым</text><rect x="770" y="223" width="91.78" height="26" rx="13" fill="#E6F4EA"/><text x="815.89" y="240.5" font-size="13" fill="#0D652D" font-weight="600" text-anchor="middle">Безопасно</text><line x1="40" y1="274" x2="920" y2="274" stroke="#DADCE0" stroke-width="1"/><text x="40" y="302" font-size="14.5" fill="#202124">Нужна версия файла из прошлого коммита.</text><text class="m" x="420" y="302" font-size="13.5" fill="#202124">git restore --source=&lt;коммит&gt; &lt;файл&gt;</text><text x="420" y="324" font-size="12.5" fill="#5F6368">текущее содержимое файла заменится</text><rect x="770" y="287" width="95.29" height="26" rx="13" fill="#FEF7E0"/><text x="817.645" y="304.5" font-size="13" fill="#9A5B00" font-weight="600" text-anchor="middle">Осторожно</text><line x1="40" y1="338" x2="920" y2="338" stroke="#DADCE0" stroke-width="1"/><text x="40" y="366" font-size="14.5" fill="#202124">Ошибочный коммит уже отправлен на GitHub.</text><text class="m" x="420" y="366" font-size="13.5" fill="#202124">git revert &lt;коммит&gt;</text><text x="420" y="388" font-size="12.5" fill="#5F6368">создаёт новый коммит-отмену</text><rect x="770" y="351" width="91.78" height="26" rx="13" fill="#E6F4EA"/><text x="815.89" y="368.5" font-size="13" fill="#0D652D" font-weight="600" text-anchor="middle">Безопасно</text><line x1="40" y1="402" x2="920" y2="402" stroke="#DADCE0" stroke-width="1"/><text x="40" y="430" font-size="14.5" fill="#202124">Последний коммит ещё не отправлен. Хотите его</text><text x="40" y="451.025" font-size="14.5" fill="#202124">переделать.</text><text class="m" x="420" y="430" font-size="13.5" fill="#202124">git reset --soft HEAD~1</text><text x="420" y="452" font-size="12.5" fill="#5F6368">коммит отменён, правки остаются</text><rect x="770" y="415" width="129.61" height="26" rx="13" fill="#FEF7E0"/><text x="834.805" y="432.5" font-size="13" fill="#9A5B00" font-weight="600" text-anchor="middle">Меняет историю</text><line x1="40" y1="466" x2="920" y2="466" stroke="#DADCE0" stroke-width="1"/><text x="40" y="494" font-size="14.5" fill="#202124">Хотите удалить все незакоммиченные правки.</text><text class="m" x="420" y="494" font-size="13.5" fill="#202124">git reset --hard</text><text x="420" y="516" font-size="12.5" fill="#5F6368">вернуть правки будет нельзя</text><rect x="770" y="479" width="70.33" height="26" rx="13" fill="#FCE8E6"/><text x="805.165" y="496.5" font-size="13" fill="#A50E0E" font-weight="600" text-anchor="middle">Опасно</text><line x1="40" y1="530" x2="920" y2="530" stroke="#DADCE0" stroke-width="1"/><text x="40" y="558" font-size="14.5" fill="#202124">Коммит «потерялся» после reset.</text><text class="m" x="420" y="558" font-size="13.5" fill="#202124">git reflog</text><text x="420" y="580" font-size="12.5" fill="#5F6368">журнал прошлых положений веток</text><rect x="770" y="543" width="91.78" height="26" rx="13" fill="#E6F4EA"/><text x="815.89" y="560.5" font-size="13" fill="#0D652D" font-weight="600" text-anchor="middle">Безопасно</text><line x1="40" y1="594" x2="920" y2="594" stroke="#DADCE0" stroke-width="1"/><circle cx="46" cy="631" r="6" fill="#1E8E3E"/><text x="60" y="636" font-size="13.5" fill="#5F6368">данные не теряются</text><circle cx="239.65" cy="631" r="6" fill="#F9AB00"/><text x="253.65" y="636" font-size="13.5" fill="#5F6368">меняет файл или историю</text><circle cx="466.78" cy="631" r="6" fill="#D93025"/><text x="480.78" y="636" font-size="13.5" fill="#5F6368">изменения можно потерять навсегда</text></svg>
