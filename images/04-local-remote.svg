<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Схема локального репозитория на компьютере и удалённого репозитория на GitHub"><title>Схема локального репозитория на компьютере и удалённого репозитория на GitHub</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="639" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Локальный и удалённый репозитории</text><text x="40" y="84" font-size="15" fill="#5F6368">origin — стандартное имя удалённого репозитория, с которым связан ваш проект.</text><rect x="30" y="116" width="520" height="400" rx="16" fill="none" stroke="#DADCE0" stroke-width="1.5" stroke-dasharray="6 6"/><text x="52" y="144" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">ВАШ КОМПЬЮТЕР</text><rect x="640" y="116" width="290" height="400" rx="16" fill="none" stroke="#DADCE0" stroke-width="1.5" stroke-dasharray="6 6"/><text x="662" y="144" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">GITHUB</text><rect x="60" y="160" width="300" height="56" rx="12" fill="#FEF7E0"/><text x="80" y="194" font-size="16" fill="#9A5B00" font-weight="600">Рабочая папка</text><rect x="60" y="252" width="300" height="56" rx="12" fill="#E8F0FE"/><text x="80" y="286" font-size="16" fill="#174EA6" font-weight="600">Staging area</text><path d="M210,218 L210,248" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text class="m" x="224" y="238" font-size="13" fill="#174EA6">git add</text><path d="M210,310 L210,342" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text class="m" x="224" y="331" font-size="13" fill="#174EA6">git commit</text><rect x="60" y="346" width="460" height="150" rx="12" fill="#E8F0FE"/><text x="80" y="376" font-size="16" fill="#174EA6" font-weight="600">Локальный репозиторий (.git)</text><rect x="80" y="394" width="196" height="84" rx="10" fill="#FFFFFF"/><text class="m" x="96" y="424" font-size="15" fill="#202124" font-weight="600">main</text><text x="96" y="448" font-size="13" fill="#5F6368">ваша ветка</text><rect x="296" y="394" width="204" height="84" rx="10" fill="#FFFFFF"/><text class="m" x="312" y="424" font-size="15" fill="#202124" font-weight="600">origin/main</text><text x="312" y="446" font-size="12.5" fill="#5F6368">состояние GitHub при</text><text x="312" y="464" font-size="12.5" fill="#5F6368">последней синхронизации</text><rect x="660" y="346" width="250" height="150" rx="12" fill="#E6F4EA"/><text x="680" y="376" font-size="16" fill="#0D652D" font-weight="600">Удалённый</text><text x="680" y="396" font-size="16" fill="#0D652D" font-weight="600">репозиторий origin</text><rect x="680" y="414" width="210" height="64" rx="10" fill="#FFFFFF"/><text class="m" x="696" y="452" font-size="15" fill="#202124" font-weight="600">main</text><path d="M524,392 L656,392" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="546.6" y="379" width="86.8" height="26" rx="13" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.2"/><text class="m" x="590" y="396.86" font-size="13.5" fill="#174EA6" text-anchor="middle">git push</text><path d="M656,436 L524,436" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="542.55" y="423" width="94.9" height="26" rx="13" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="1.2"/><text class="m" x="590" y="440.86" font-size="13.5" fill="#0D652D" text-anchor="middle">git fetch</text><path d="M656,480 L524,480" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="546.6" y="467" width="86.8" height="26" rx="13" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="1.2"/><text class="m" x="590" y="484.86" font-size="13.5" fill="#0D652D" text-anchor="middle">git pull</text><path d="M785,342 V188 H366" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="412.55" y="175" width="94.9" height="26" rx="13" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.2"/><text class="m" x="460" y="192.86" font-size="13.5" fill="#3C4043" text-anchor="middle">git clone</text><text x="460" y="216" font-size="12.5" fill="#5F6368" text-anchor="middle">первое скачивание проекта</text><text x="40" y="556" font-size="14.5" fill="#202124"><tspan class="m">git push</tspan> — отправить ваши коммиты на GitHub.</text><text x="40" y="584" font-size="14.5" fill="#202124"><tspan class="m">git fetch</tspan> — скачать новости с GitHub в origin/main, не меняя ваши файлы.</text><text x="40" y="612" font-size="14.5" fill="#202124"><tspan class="m">git pull</tspan> — скачать и сразу объединить с вашей веткой (fetch + merge).</text></svg>
