<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Пример конфликта слияния с маркерами &lt;&lt;&lt;&lt;&lt;&lt;&lt;, ======= и &gt;&gt;&gt;&gt;&gt;&gt;&gt;"><title>Пример конфликта слияния с маркерами &lt;&lt;&lt;&lt;&lt;&lt;&lt;, ======= и &gt;&gt;&gt;&gt;&gt;&gt;&gt;</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="539" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Как выглядит конфликт слияния</text><text x="40" y="84" font-size="15" fill="#5F6368">Обе ветки изменили одну и ту же строку. Git не знает, какую версию оставить, и просит выбрать вас.</text><rect x="40" y="124" width="480" height="290" rx="12" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/><text class="m" x="60" y="152" font-size="13" fill="#5F6368">shopping.txt</text><line x1="40" y1="166" x2="520" y2="166" stroke="#DADCE0" stroke-width="1"/><text class="m" x="60" y="200" font-size="15.5" fill="#202124">Список покупок</text><rect x="41" y="211" width="478" height="32" rx="0" fill="#E8F0FE"/><text class="m" x="60" y="232" font-size="15.5" fill="#174EA6" font-weight="600">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text><rect x="41" y="243" width="478" height="32" rx="0" fill="#E8F0FE"/><text class="m" x="60" y="264" font-size="15.5" fill="#174EA6">Молоко — 2 литра</text><rect x="41" y="275" width="478" height="32" rx="0" fill="#F1F3F4"/><text class="m" x="60" y="296" font-size="15.5" fill="#3C4043" font-weight="600">=======</text><rect x="41" y="307" width="478" height="32" rx="0" fill="#E6F4EA"/><text class="m" x="60" y="328" font-size="15.5" fill="#0D652D">Молоко — 1 литр</text><rect x="41" y="339" width="478" height="32" rx="0" fill="#E6F4EA"/><text class="m" x="60" y="360" font-size="15.5" fill="#0D652D" font-weight="600">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/milk</text><text class="m" x="60" y="392" font-size="15.5" fill="#202124">Хлеб</text><line x1="526" y1="211" x2="552" y2="211" stroke="#1A73E8" stroke-width="2"/><text x="564" y="208" font-size="16" fill="#174EA6" font-weight="600">Ваша версия</text><text x="564" y="228" font-size="13.5" fill="#5F6368">из текущей ветки (HEAD)</text><line x1="526" y1="275" x2="552" y2="275" stroke="#5F6368" stroke-width="2"/><text x="564" y="272" font-size="16" fill="#3C4043" font-weight="600">Разделитель</text><text x="564" y="292" font-size="13.5" fill="#5F6368">между двумя версиями</text><line x1="526" y1="339" x2="552" y2="339" stroke="#1E8E3E" stroke-width="2"/><text x="564" y="336" font-size="16" fill="#0D652D" font-weight="600">Другая версия</text><text x="564" y="356" font-size="13.5" fill="#5F6368">из ветки feature/milk</text><text x="40" y="452" font-size="11.5" fill="#5F6368" font-weight="600" letter-spacing="1.2">КАК ИСПРАВИТЬ</text><circle cx="53" cy="487" r="13" fill="#1A73E8"/><text x="53" y="492" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="74" y="492" font-size="14" fill="#202124">Оставьте нужный текст</text><circle cx="278" cy="487" r="13" fill="#1A73E8"/><text x="278" y="492" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><text x="299" y="492" font-size="14" fill="#202124">Удалите строки-маркеры</text><circle cx="503" cy="487" r="13" fill="#1A73E8"/><text x="503" y="492" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="524" y="492" font-size="14" fill="#202124"><tspan class="m">git add shopping.txt</tspan></text><circle cx="728" cy="487" r="13" fill="#1A73E8"/><text x="728" y="492" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="749" y="492" font-size="14" fill="#202124"><tspan class="m">git commit</tspan></text></svg>
