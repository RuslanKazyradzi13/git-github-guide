<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="Схема страницы Pull Request на GitHub (не скриншот)"><title>Схема страницы Pull Request на GitHub (не скриншот)</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="619" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Страница Pull Request</text><text x="40" y="84" font-size="15" fill="#5F6368">Что где находится на странице запроса на слияние.</text><rect x="698.25" y="35" width="221.75" height="26" rx="13" fill="#FEF7E0"/><text x="809.125" y="52.5" font-size="12.5" fill="#9A5B00" font-weight="600" text-anchor="middle">Схема интерфейса · не скриншот</text><rect x="40" y="112" width="560" height="480" rx="12" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.2"/><rect x="40.6" y="112.6" width="558.8" height="36" rx="11.5" fill="#F1F3F4"/><rect x="40.6" y="136" width="558.8" height="13" rx="0" fill="#F1F3F4"/><circle cx="58" cy="130" r="4.5" fill="#DADCE0"/><circle cx="72" cy="130" r="4.5" fill="#DADCE0"/><circle cx="86" cy="130" r="4.5" fill="#DADCE0"/><rect x="110" y="120" width="470" height="20" rx="10" fill="#FFFFFF"/><text x="124" y="134.5" font-size="12" fill="#5F6368">github.com/ivan-petrov/my-site/pull/1</text><text x="64" y="184" font-size="18" fill="#202124" font-weight="600">Добавить страницу контактов #1</text><rect x="64" y="198" width="58" height="24" rx="12" fill="#1F883D"/><text x="93" y="214.5" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">Open</text><text x="132" y="214.5" font-size="12" fill="#5F6368">ivan-petrov wants to merge 1 commit into</text><text class="m" x="132" y="232" font-size="12" fill="#202124" font-weight="500">main from feature/contacts</text><circle cx="578" cy="216" r="11" fill="#1A73E8"/><text x="578" y="220.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="64" y="266" font-size="12.5" fill="#202124" font-weight="600">Conversation</text><text x="168.75" y="266" font-size="12.5" fill="#202124">Commits 1</text><text x="256.25" y="266" font-size="12.5" fill="#202124">Checks 1</text><text x="333.25" y="266" font-size="12.5" fill="#202124">Files changed 1</text><rect x="60" y="274" width="88.75" height="3" rx="1.5" fill="#FD8C73"/><line x1="40" y1="278" x2="600" y2="278" stroke="#D8DEE4" stroke-width="1"/><circle cx="440.75" cy="262" r="11" fill="#1A73E8"/><text x="440.75" y="266.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><circle cx="78" cy="310" r="14" fill="#D0D7DE"/><rect x="102" y="294" width="454" height="70" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="114" y="318" font-size="12.5" fill="#202124">Что сделано: добавлена страница контактов.</text><text x="114" y="342" font-size="12.5" fill="#202124">Как проверить: открыть contacts.html в браузере.</text><rect x="102" y="380" width="454" height="40" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><circle cx="122" cy="400" r="9" fill="#1F883D"/><text x="122" y="404.5" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">✓</text><text x="140" y="405" font-size="13" fill="#202124" font-weight="600">All checks have passed</text><circle cx="578" cy="400" r="11" fill="#1A73E8"/><text x="578" y="404.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><rect x="102" y="436" width="454" height="120" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><circle cx="122" cy="458" r="9" fill="#1F883D"/><text x="122" y="462.5" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">✓</text><text x="140" y="463" font-size="12.5" fill="#202124" font-weight="600">This branch has no conflicts with the base branch</text><rect x="118" y="498" width="168" height="34" rx="6" fill="#1F883D"/><text x="202" y="519.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Merge pull request  ▾</text><circle cx="302" cy="515" r="11" fill="#1A73E8"/><text x="302" y="519.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><circle cx="647" cy="145" r="11" fill="#1A73E8"/><text x="647" y="149.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="668" y="150" font-size="14" fill="#202124">Откуда и куда: из ветки</text><text x="668" y="170.3" font-size="14" fill="#202124">feature/contacts в main.</text><circle cx="647" cy="199.6" r="11" fill="#1A73E8"/><text x="647" y="204.1" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><text x="668" y="204.6" font-size="14" fill="#202124">Files changed — построчные</text><text x="668" y="224.9" font-size="14" fill="#202124">изменения. Здесь проходит ревью.</text><circle cx="647" cy="254.2" r="11" fill="#1A73E8"/><text x="647" y="258.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="668" y="259.2" font-size="14" fill="#202124">Результат автоматических</text><text x="668" y="279.5" font-size="14" fill="#202124">проверок, если они настроены.</text><circle cx="647" cy="308.8" r="11" fill="#1A73E8"/><text x="647" y="313.3" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="668" y="313.8" font-size="14" fill="#202124">Слияние. Стрелка рядом с кнопкой —</text><text x="668" y="334.1" font-size="14" fill="#202124">выбор способа слияния.</text></svg>
