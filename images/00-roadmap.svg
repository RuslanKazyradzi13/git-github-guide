174EA6" font-weight="600">1</text><text x="54" y="214" font-size="13.5" fill="#202124" font-weight="500">Основы</text><rect x="151.429" y="152" width="100" height="96" rx="12" fill="#E8F0FE"/><text x="165.429" y="188" font-size="24" fill="#174EA6" font-weight="600">2</text><text x="165.429" y="214" font-size="13.5" fill="#202124" font-weight="500">Установка</text><rect x="262.857" y="152" width="100" height="96" rx="12" fill="#E8F0FE"/><text x="276.857" y="188" font-size="24" fill="#174EA6" font-weight="600">3</text><text x="276.857" y="214" font-size="13.5" fill="#202124" font-weight="500">Команды</text><rect x="374.286" y="152" width="100" height="96" rx="12" fill="#E8F0FE"/><text x="388.286" y="188" font-size="24" fill="#174EA6" font-weight="600">4</text><text x="388.286" y="214" font-size="13.5" fill="#202124" font-weight="500">GitHub</text><rect x="485.714" y="152" width="100" height="96" rx="12" fill="#E8F0FE"/><text x="499.714" y="188" font-size="24" fill="#174EA6" font-weight="600">5</text><text x="499.714" y="214" font-size="13.5" fill="#202124" font-weight="500">Ветки</text><text x="499.714" y="232" font-size="13.5" fill="#202124" font-weight="500">и PR</text><rect x="597.143" y="152" width="100" height="96" rx="12" fill="#E8F0FE"/><text x="611.143" y="188" font-size="24" fill="#174EA6" font-weight="600">6</text><text x="611.143" y="214" font-size="13.5" fill="#202124" font-weight="500">Ошибки</text><text x="611.143" y="232" font-size="13.5" fill="#202124" font-weight="500">и откат</text><rect x="708.571" y="152" width="100" height="96" rx="12" fill="#E8F0FE"/><text x="722.571" y="188" font-size="24" fill="#174EA6" font-weight="600">7</text><text x="722.571" y="214" font-size="13.5" fill="#202124" font-weight="500">Git и</text><text x="722.571" y="232" font-size="13.5" fill="#202124" font-weight="500">Claude Code</text><rect x="820" y="152" width="100" height="96" rx="12" fill="#E8F0FE"/><text x="834" y="188" font-size="24" fill="#174EA6" font-weight="600"