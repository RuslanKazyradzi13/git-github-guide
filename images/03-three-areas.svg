<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Схема трёх зон Git: рабочая папка, staging area, история коммитов"><title>Схема трёх зон Git: рабочая папка, staging area, история коммитов</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="559" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Три зоны Git</text><text x="40" y="84" font-size="15" fill="#5F6368">Изменение проходит путь: рабочая папка → staging area → история коммитов.</text><rect x="40" y="116" width="220" height="190" rx="12" fill="#FEF7E0"/><text x="58" y="147.6" font-size="17" fill="#9A5B00" font-weight="600">Рабочая папка</text><text class="m" x="58" y="171.7" font-size="13" fill="#5F6368">working directory</text><text x="58" y="199.7" font-size="14.5" fill="#202124">Файлы, которые вы</text><text x="58" y="220.725" font-size="14.5" fill="#202124">видите и редактируете.</text><text x="58" y="290" font-size="13" fill="#5F6368" font-style="italic">Как рабочий стол</text><rect x="370" y="116" width="220" height="190" rx="12" fill="#E8F0FE"/><text x="388" y="147.6" font-size="17" fill="#174EA6" font-weight="600">Staging area</text><text class="m" x="388" y="171.7" font-size="13" fill="#5F6368">индекс</text><text x="388" y="199.7" font-size="14.5" fill="#202124">Изменения, отобранные</text><text x="388" y="220.725" font-size="14.5" fill="#202124">для следующего коммита.</text><text x="388" y="290" font-size="13" fill="#5F6368" font-style="italic">Как коробка перед отправкой</text><rect x="700" y="116" width="220" height="190" rx="12" fill="#E6F4EA"/><text x="718" y="147.6" font-size="17" fill="#0D652D" font-weight="600">История коммитов</text><text class="m" x="718" y="171.7" font-size="13" fill="#5F6368">репозиторий .git</text><text x="718" y="199.7" font-size="14.5" fill="#202124">Сохранённые снимки</text><text x="718" y="220.725" font-size="14.5" fill="#202124">проекта.</text><text x="718" y="290" font-size="13" fill="#5F6368" font-style="italic">Как фотоальбом версий</text><text class="m" x="315" y="176" font-size="14" fill="#174EA6" text-anchor="middle">git add</text><path d="M264,196 L366,196" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text class="m" x="645" y="176" font-size="14" fill="#0D652D" text-anchor="middle">git commit</text><path d="M594,196 L696,196" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><path d="M440,310 C440,372 150,372 150,314" fill="none" stroke="#F9AB00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-yellow)"/><rect x="211.1" y="347" width="167.8" height="26" rx="13" fill="#FFFFFF" stroke="#F9AB00" stroke-width="1.2"/><text class="m" x="295" y="364.86" font-size="13.5" fill="#9A5B00" text-anchor="middle">git restore &lt;файл&gt;</text><text x="295" y="392" font-size="12.5" fill="#5F6368" text-anchor="middle">отменить правки в рабочей папке</text><path d="M810,310 C810,372 520,372 520,314" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="544.65" y="347" width="240.7" height="26" rx="13" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.2"/><text class="m" x="665" y="364.86" font-size="13.5" fill="#174EA6" text-anchor="middle">git restore --staged &lt;файл&gt;</text><text x="665" y="392" font-size="12.5" fill="#5F6368" text-anchor="middle">убрать из staging, правки сохранятся</text><rect x="40" y="426" width="880" height="100" rx="12" fill="#F1F3F4"/><text x="64" y="462" font-size="14.5" fill="#202124"><tspan class="m">git status</tspan> — показывает, что лежит в каждой зоне</text><text x="64" y="494" font-size="14.5" fill="#202124"><tspan class="m">git diff</tspan> — рабочая папка против staging   ·   <tspan class="m">git diff --staged</tspan> — staging против последнего коммита</text></svg>
