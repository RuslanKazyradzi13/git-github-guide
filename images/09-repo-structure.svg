<svg xmlns="http://www.w3.org/2000/svg" width="960" height="792" viewBox="0 0 960 792" role="img" aria-label="Структура профессионального репозитория с пометками, какие файлы нужны"><title>Структура профессионального репозитория с пометками, какие файлы нужны</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="791" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Структура профессионального репозитория</text><text x="40" y="84" font-size="15" fill="#5F6368">Цвет показывает, на каком уровне зрелости проекта элемент обычно нужен.</text><text class="m" x="56" y="140" font-size="14.5" fill="#202124" font-weight="600">my-project/</text><text class="m" x="56" y="166" font-size="14.5" fill="#202124">├── README.md</text><circle cx="430" cy="161" r="6" fill="#1E8E3E"/><text x="450" y="166" font-size="14.5" fill="#5F6368">главная страница проекта</text><text class="m" x="56" y="192" font-size="14.5" fill="#202124">├── LICENSE</text><circle cx="430" cy="187" r="6" fill="#1E8E3E"/><text x="450" y="192" font-size="14.5" fill="#5F6368">условия использования кода</text><text class="m" x="56" y="218" font-size="14.5" fill="#202124">├── .gitignore</text><circle cx="430" cy="213" r="6" fill="#1E8E3E"/><text x="450" y="218" font-size="14.5" fill="#5F6368">что Git не должен сохранять</text><text class="m" x="56" y="244" font-size="14.5" fill="#202124">├── src/</text><circle cx="430" cy="239" r="6" fill="#1E8E3E"/><text x="450" y="244" font-size="14.5" fill="#5F6368">исходный код</text><text class="m" x="56" y="270" font-size="14.5" fill="#202124">├── tests/</text><circle cx="430" cy="265" r="6" fill="#1A73E8"/><text x="450" y="270" font-size="14.5" fill="#5F6368">автоматические тесты</text><text class="m" x="56" y="296" font-size="14.5" fill="#202124">├── CHANGELOG.md</text><circle cx="430" cy="291" r="6" fill="#1A73E8"/><text x="450" y="296" font-size="14.5" fill="#5F6368">журнал изменений по версиям</text><text class="m" x="56" y="322" font-size="14.5" fill="#202124">├── .editorconfig</text><circle cx="430" cy="317" r="6" fill="#1A73E8"/><text x="450" y="322" font-size="14.5" fill="#5F6368">единые отступы и кодировка</text><text class="m" x="56" y="348" font-size="14.5" fill="#202124">├── .gitattributes</text><circle cx="430" cy="343" r="6" fill="#1A73E8"/><text x="450" y="348" font-size="14.5" fill="#5F6368">правила для концов строк</text><text class="m" x="56" y="374" font-size="14.5" fill="#202124">├── docs/</text><circle cx="430" cy="369" r="6" fill="#1A73E8"/><text x="450" y="374" font-size="14.5" fill="#5F6368">подробная документация</text><text class="m" x="56" y="400" font-size="14.5" fill="#202124">├── CONTRIBUTING.md</text><circle cx="430" cy="395" r="6" fill="#9334E6"/><text x="450" y="400" font-size="14.5" fill="#5F6368">как предложить изменение</text><text class="m" x="56" y="426" font-size="14.5" fill="#202124">├── CODE_OF_CONDUCT.md</text><circle cx="430" cy="421" r="6" fill="#9334E6"/><text x="450" y="426" font-size="14.5" fill="#5F6368">правила общения участников</text><text class="m" x="56" y="452" font-size="14.5" fill="#202124">├── SECURITY.md</text><circle cx="430" cy="447" r="6" fill="#1A73E8"/><text x="450" y="452" font-size="14.5" fill="#5F6368">как сообщить об уязвимости</text><text class="m" x="56" y="478" font-size="14.5" fill="#202124">├── .env.example</text><circle cx="430" cy="473" r="6" fill="#5F6368"/><text x="450" y="478" font-size="14.5" fill="#5F6368">образец настроек без секретов</text><text class="m" x="56" y="504" font-size="14.5" fill="#202124">├── CITATION.cff</text><circle cx="430" cy="499" r="6" fill="#5F6368"/><text x="450" y="504" font-size="14.5" fill="#5F6368">как цитировать научное ПО</text><text class="m" x="56" y="530" font-size="14.5" fill="#202124">├── examples/</text><circle cx="430" cy="525" r="6" fill="#5F6368"/><text x="450" y="530" font-size="14.5" fill="#5F6368">примеры использования</text><text class="m" x="56" y="556" font-size="14.5" fill="#202124">├── scripts/</text><circle cx="430" cy="551" r="6" fill="#5F6368"/><text x="450" y="556" font-size="14.5" fill="#5F6368">служебные скрипты</text><text class="m" x="56" y="582" font-size="14.5" fill="#202124" font-weight="600">└── .github/</text><text x="450" y="582" font-size="14.5" fill="#5F6368">настройки GitHub</text><text class="m" x="56" y="608" font-size="14.5" fill="#202124">    ├── workflows/</text><circle cx="430" cy="603" r="6" fill="#1A73E8"/><text x="450" y="608" font-size="14.5" fill="#5F6368">автоматические проверки (CI)</text><text class="m" x="56" y="634" font-size="14.5" fill="#202124">    ├── dependabot.yml</text><circle cx="430" cy="629" r="6" fill="#1A73E8"/><text x="450" y="634" font-size="14.5" fill="#5F6368">обновление зависимостей</text><text class="m" x="56" y="660" font-size="14.5" fill="#202124">    ├── pull_request_template.md</text><circle cx="430" cy="655" r="6" fill="#1A73E8"/><text x="450" y="660" font-size="14.5" fill="#5F6368">шаблон описания PR</text><text class="m" x="56" y="686" font-size="14.5" fill="#202124">    └── ISSUE_TEMPLATE/</text><circle cx="430" cy="681" r="6" fill="#9334E6"/><text x="450" y="686" font-size="14.5" fill="#5F6368">шаблоны сообщений об ошибках</text><line x1="40" y1="712" x2="920" y2="712" stroke="#DADCE0" stroke-width="1"/><circle cx="56" cy="742" r="6" fill="#1E8E3E"/><text x="70" y="747" font-size="13.5" fill="#5F6368">базовый: почти любой проект</text><circle cx="301.455" cy="742" r="6" fill="#1A73E8"/><text x="315.455" y="747" font-size="13.5" fill="#5F6368">профессиональный</text><circle cx="479.545" cy="742" r="6" fill="#9334E6"/><text x="493.545" y="747" font-size="13.5" fill="#5F6368">публичный open-source</text><circle cx="687.47" cy="742" r="6" fill="#5F6368"/><text x="701.47" y="747" font-size="13.5" fill="#5F6368">по ситуации</text></svg>
