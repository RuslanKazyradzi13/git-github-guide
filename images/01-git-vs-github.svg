<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Инфографика: чем Git отличается от GitHub"><title>Инфографика: чем Git отличается от GitHub</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="539" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Git и GitHub: в чём разница</text><text x="40" y="84" font-size="15" fill="#5F6368">Git сохраняет версии на вашем компьютере. GitHub хранит копию проекта в интернете и помогает работать вместе.</text><rect x="40" y="124" width="370" height="340" rx="14" fill="#E8F0FE"/><text x="66" y="172" font-size="30" fill="#174EA6" font-weight="600">Git</text><text x="66" y="198" font-size="15" fill="#5F6368">программа на вашем компьютере</text><circle cx="71" cy="235" r="3.2" fill="#1A73E8"/><text x="84" y="240" font-size="15" fill="#202124">Запоминает каждую сохранённую версию</text><circle cx="71" cy="269" r="3.2" fill="#1A73E8"/><text x="84" y="274" font-size="15" fill="#202124">Работает без интернета</text><circle cx="71" cy="303" r="3.2" fill="#1A73E8"/><text x="84" y="308" font-size="15" fill="#202124">Бесплатная, с открытым исходным кодом</text><circle cx="71" cy="337" r="3.2" fill="#1A73E8"/><text x="84" y="342" font-size="15" fill="#202124">Управляется командами в терминале</text><rect x="58" y="384" width="334" height="62" rx="10" fill="#FFFFFF"/><text x="74" y="408" font-size="12.5" fill="#5F6368" font-weight="500">Аналогия</text><text x="74" y="432" font-size="15" fill="#202124" font-weight="500">История версий документа</text><rect x="550" y="124" width="370" height="340" rx="14" fill="#E6F4EA"/><text x="576" y="172" font-size="30" fill="#0D652D" font-weight="600">GitHub</text><text x="576" y="198" font-size="15" fill="#5F6368">сайт и облачный сервис</text><circle cx="581" cy="235" r="3.2" fill="#1E8E3E"/><text x="594" y="240" font-size="15" fill="#202124">Хранит копию репозитория в интернете</text><circle cx="581" cy="269" r="3.2" fill="#1E8E3E"/><text x="594" y="274" font-size="15" fill="#202124">Показывает историю и изменения</text><circle cx="581" cy="303" r="3.2" fill="#1E8E3E"/><text x="594" y="308" font-size="15" fill="#202124">Pull Request, Issues, автопроверки</text><circle cx="581" cy="337" r="3.2" fill="#1E8E3E"/><text x="594" y="342" font-size="15" fill="#202124">Нужны интернет и аккаунт</text><rect x="568" y="384" width="334" height="62" rx="10" fill="#FFFFFF"/><text x="584" y="408" font-size="12.5" fill="#5F6368" font-weight="500">Аналогия</text><text x="584" y="432" font-size="15" fill="#202124" font-weight="500">Облачный диск и рабочее место команды</text><path d="M424,250 L542,250" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="439.6" y="237" width="86.8" height="26" rx="13" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.2"/><text class="m" x="483" y="254.86" font-size="13.5" fill="#174EA6" text-anchor="middle">git push</text><text x="483" y="280" font-size="13" fill="#5F6368" text-anchor="middle">отправить</text><path d="M542,340 L424,340" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="439.6" y="327" width="86.8" height="26" rx="13" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="1.2"/><text class="m" x="483" y="344.86" font-size="13.5" fill="#0D652D" text-anchor="middle">git pull</text><text x="483" y="370" font-size="13" fill="#5F6368" text-anchor="middle">получить</text><text x="480" y="506" font-size="14" fill="#5F6368" text-anchor="middle">Git можно использовать без GitHub. Похожие сервисы: GitLab, Bitbucket, Gitea.</text></svg>
