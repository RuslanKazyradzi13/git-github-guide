<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="Жизненный цикл файла в Git: untracked, staged, committed, modified"><title>Жизненный цикл файла в Git: untracked, staged, committed, modified</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="489" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Жизненный цикл файла</text><text x="40" y="84" font-size="15" fill="#5F6368">Git отслеживает состояние каждого файла. Команда git status показывает эти состояния.</text><rect x="40" y="124" width="228" height="120" rx="12" fill="#F1F3F4"/><text x="58" y="155.6" font-size="17" fill="#3C4043" font-weight="600">Неотслеживаемый</text><text class="m" x="58" y="179.7" font-size="13" fill="#5F6368">untracked</text><text x="58" y="207.7" font-size="14" fill="#202124">Новый файл. Git за ним ещё</text><text x="58" y="228" font-size="14" fill="#202124">не следит.</text><rect x="366" y="124" width="228" height="120" rx="12" fill="#E8F0FE"/><text x="384" y="155.6" font-size="17" fill="#174EA6" font-weight="600">Подготовлен</text><text class="m" x="384" y="179.7" font-size="13" fill="#5F6368">staged</text><text x="384" y="207.7" font-size="14" fill="#202124">Войдёт в следующий</text><text x="384" y="228" font-size="14" fill="#202124">коммит.</text><rect x="692" y="124" width="228" height="120" rx="12" fill="#E6F4EA"/><text x="710" y="155.6" font-size="17" fill="#0D652D" font-weight="600">Сохранён</text><text class="m" x="710" y="179.7" font-size="13" fill="#5F6368">committed</text><text x="710" y="207.7" font-size="14" fill="#202124">Версия записана в историю.</text><text class="m" x="317" y="176" font-size="14" fill="#174EA6" text-anchor="middle">git add</text><path d="M272,194 L362,194" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text class="m" x="643" y="176" font-size="14" fill="#0D652D" text-anchor="middle">git commit</text><path d="M598,194 L688,194" fill="none" stroke="#1E8E3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="692" y="334" width="228" height="124" rx="12" fill="#FEF7E0"/><text x="710" y="365.6" font-size="17" fill="#9A5B00" font-weight="600">Изменён</text><text class="m" x="710" y="389.7" font-size="13" fill="#5F6368">modified</text><text x="710" y="417.7" font-size="14" fill="#202124">Файл отредактирован после</text><text x="710" y="438" font-size="14" fill="#202124">коммита.</text><path d="M806,248 L806,330" fill="none" stroke="#F9AB00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-yellow)"/><text x="794" y="294" font-size="13" fill="#5F6368" text-anchor="end">вы меняете файл</text><path d="M688,396 H480 V250" fill="none" stroke="#1A73E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="545.65" y="383" width="78.7" height="26" rx="13" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.2"/><text class="m" x="585" y="400.86" font-size="13.5" fill="#174EA6" text-anchor="middle">git add</text><text x="40" y="300" font-size="14" fill="#5F6368">Пример: создали notes.txt — он</text><text x="40" y="320.3" font-size="14" fill="#5F6368">неотслеживаемый. После git add — подготовлен.</text><text x="40" y="340.6" font-size="14" fill="#5F6368">После git commit — сохранён. Изменили снова —</text><text x="40" y="360.9" font-size="14" fill="#5F6368">изменён.</text></svg>
