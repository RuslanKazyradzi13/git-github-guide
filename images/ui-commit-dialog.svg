<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Схема окна сохранения изменений на сайте GitHub (не скриншот)"><title>Схема окна сохранения изменений на сайте GitHub (не скриншот)</title><style>text{font-family:'Google Sans','Roboto','Segoe UI',Arial,sans-serif;}.m{font-family:'Roboto Mono',Consolas,'Cascadia Mono','Courier New',monospace;}</style><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9334E6"/></marker></defs><rect x="0.5" y="0.5" width="959" height="519" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="40" y="54" font-size="24" fill="#202124" font-weight="500">Сохранение изменений на сайте</text><text x="40" y="84" font-size="15" fill="#5F6368">Окно открывается кнопкой Commit changes... после правки файла.</text><rect x="698.25" y="35" width="221.75" height="26" rx="13" fill="#FEF7E0"/><text x="809.125" y="52.5" font-size="12.5" fill="#9A5B00" font-weight="600" text-anchor="middle">Схема интерфейса · не скриншот</text><rect x="40" y="116" width="560" height="370" rx="12" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.2"/><text x="64" y="154" font-size="17" fill="#202124" font-weight="600">Commit changes</text><text x="574" y="154" font-size="20" fill="#5F6368" text-anchor="middle">×</text><line x1="40" y1="172" x2="600" y2="172" stroke="#D8DEE4" stroke-width="1"/><text x="64" y="202" font-size="12.5" fill="#5F6368" font-weight="500">Commit message</text><rect x="64" y="210" width="490" height="30" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="74" y="229.5" font-size="13" fill="#202124">Update README.md</text><circle cx="578" cy="225" r="11" fill="#1A73E8"/><text x="578" y="229.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="64" y="266" font-size="12.5" fill="#5F6368" font-weight="500">Extended description</text><rect x="64" y="274" width="490" height="56" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="74" y="296" font-size="13" fill="#8C959F">Add an optional extended description...</text><circle cx="578" cy="302" r="11" fill="#1A73E8"/><text x="578" y="306.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><circle cx="72" cy="358" r="6.5" fill="#FFFFFF" stroke="#1A73E8" stroke-width="4.5"/><text x="86" y="363" font-size="13.5" fill="#202124">Commit directly to the main branch</text><circle cx="578" cy="358" r="11" fill="#1A73E8"/><text x="578" y="362.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><circle cx="72" cy="390" r="6.5" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.2"/><text x="86" y="395" font-size="13.5" fill="#202124">Create a new branch for this commit and start a pull request</text><circle cx="578" cy="390" r="11" fill="#1A73E8"/><text x="578" y="394.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><line x1="40" y1="420" x2="600" y2="420" stroke="#D8DEE4" stroke-width="1"/><rect x="294" y="436" width="90" height="30" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="339" y="455.5" font-size="13" fill="#202124" font-weight="500" text-anchor="middle">Cancel</text><rect x="394" y="436" width="146" height="30" rx="6" fill="#1F883D"/><text x="467" y="455.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Commit changes</text><circle cx="566" cy="451" r="11" fill="#1A73E8"/><text x="566" y="455.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text><circle cx="647" cy="145" r="11" fill="#1A73E8"/><text x="647" y="149.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="668" y="150" font-size="14" fill="#202124">Короткое сообщение: что изменено.</text><circle cx="647" cy="179.3" r="11" fill="#1A73E8"/><text x="647" y="183.8" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><text x="668" y="184.3" font-size="14" fill="#202124">Подробности — по желанию.</text><circle cx="647" cy="213.6" r="11" fill="#1A73E8"/><text x="647" y="218.1" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="668" y="218.6" font-size="14" fill="#202124">Сохранить прямо в main. Подходит</text><text x="668" y="238.9" font-size="14" fill="#202124">для личного учебного проекта.</text><circle cx="647" cy="268.2" r="11" fill="#1A73E8"/><text x="647" y="272.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="668" y="273.2" font-size="14" fill="#202124">Создать ветку и Pull Request. Так</text><text x="668" y="293.5" font-size="14" fill="#202124">работают в команде.</text><circle cx="647" cy="322.8" r="11" fill="#1A73E8"/><text x="647" y="327.3" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text><text x="668" y="327.8" font-size="14" fill="#202124">Сохранить коммит.</text></svg>
