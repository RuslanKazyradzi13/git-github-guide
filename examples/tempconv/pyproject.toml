[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tempconv"
version = "1.0.0"
description = "Учебный конвертер температур между шкалами Цельсия, Фаренгейта и Кельвина"
readme = "README.md"
requires-python = ">=3.11"
# SPDX-идентификатор лицензии (см. главу 10 методички)
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "[ИМЯ АВТОРА]" }]

[project.scripts]
tempconv = "tempconv.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
