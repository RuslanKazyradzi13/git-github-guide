<!doctype html>
<!--
  Анимация для шапки README и картинка для соцсетей.
  Кадры снимает tools/make_hero.mjs: вызывает render(t) и делает снимок.
  Параметры адреса: ?theme=light|dark  ?mode=anim|social  ?play — проиграть в браузере
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; overflow: hidden; }
  svg { display: block; }
  text { font-family: Roboto, Arial, sans-serif; }
  .m { font-family: "Roboto Mono", Consolas, monospace; white-space: pre; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const P = new URLSearchParams(location.search);
const THEME = P.get("theme") === "dark" ? "dark" : "light";
const MODE = P.get("mode") === "social" ? "social" : "anim";
const W = 1280, H = MODE === "social" ? 640 : 520;

// Палитра Google; фон совпадает с фоном GitHub в светлой и тёмной теме.
const C = THEME === "dark" ? {
  page: "#0d1117", card: "#161b22", border: "#30363d", text: "#e6edf3", muted: "#9198a1",
  blue: "#8ab4f8", green: "#81c995", red: "#f28b82", yellow: "#fdd663", onPill: "#0d1117",
  term: "#161b22", termBorder: "#30363d", termLine: "#30363d",
} : {
  page: "#ffffff", card: "#f8f9fa", border: "#dadce0", text: "#202124", muted: "#5f6368",
  blue: "#1a73e8", green: "#188038", red: "#d93025", yellow: "#f9ab00", onPill: "#ffffff",
  term: "#202124", termBorder: "#202124", termLine: "#3c4043",
};
const T = { fg: "#e8eaed", muted: "#9aa0a6", blue: "#8ab4f8", green: "#81c995", yellow: "#fdd663", red: "#f28b82" };
document.body.style.background = C.page;

// ---------- Сценарий ----------
const PROMPT = [["PS C:\\demo> ", "blue"]];
const STEPS = [
  { cmd: [["git init", "fg"]],
    out: [[["Initialized empty Git repository in C:/demo/.git/", "muted"]]],
    caption: "Создаём репозиторий" },
  { cmd: [["git add .", "fg"]], out: [], caption: "Добавляем файлы в индекс" },
  { cmd: [["git commit -m ", "fg"], ['"Первый коммит"', "yellow"]],
    out: [[["[", "muted"], ["main", "blue"], [" (root-commit) 3f1c2a9] Первый коммит", "muted"]]],
    caption: "Сохраняем версию — коммит" },
  { cmd: [["git switch -c ", "fg"], ["feature", "green"]],
    out: [[["Switched to a new branch '", "muted"], ["feature", "green"], ["'", "muted"]]],
    caption: "Создаём ветку для задачи" },
  { cmd: [["git commit -am ", "fg"], ['"Добавить раздел"', "yellow"]],
    out: [[["[", "muted"], ["feature", "green"], [" 8d4e1b7] Добавить раздел", "muted"]]],
    caption: "Коммитим в ветке" },
  { cmd: [["git switch ", "fg"], ["main", "blue"]],
    out: [[["Switched to branch '", "muted"], ["main", "blue"], ["'", "muted"]]],
    caption: "Возвращаемся в main" },
  { cmd: [["git commit -am ", "fg"], ['"Обновить README"', "yellow"]],
    out: [[["[", "muted"], ["main", "blue"], [" 5b9f0c2] Обновить README", "muted"]]],
    caption: "Продолжаем работу в main" },
  { cmd: [["git merge ", "fg"], ["feature", "green"]],
    out: [[["Merge made by the 'ort' strategy.", "muted"]]],
    caption: "Объединяем ветки" },
  { cmd: [["git push -u origin ", "fg"], ["main", "blue"]],
    out: [[["To https://github.com/you/demo.git", "muted"]],
          [[" * [new branch]      main -> main", "muted"]],
          [["branch 'main' set up to track 'origin/main'.", "muted"]]],
    caption: "Отправляем на GitHub", dwell: 2.0 },
];
const STEP_COLORS = ["blue", "red", "yellow", "green"];

// Детерминированное «живое» печатание: небольшой разброс задержек.
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const CPS = 0.03;
let clock = 0.7;
for (const s of STEPS) {
  s.len = s.cmd.reduce((n, [txt]) => n + txt.length, 0);
  s.start = clock;
  s.charT = [];
  let c = clock;
  for (let i = 0; i < s.len; i++) { c += CPS * (0.6 + 0.8 * rnd()); s.charT.push(c); }
  s.enter = c + 0.22;
  clock = s.enter + (s.dwell ?? 0.6);
}
const ACT_END = clock, HOLD = 2.2, FADE = 0.6;
window.DURATION = ACT_END + HOLD + FADE;
const E = STEPS.map((s) => s.enter);

// ---------- Вспомогательные функции ----------
const clamp = (x) => Math.max(0, Math.min(1, x));
const prog = (t, a, d) => clamp((t - a) / d);
const outBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
const inOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
const outCubic = (x) => 1 - (1 - x) ** 3;
const lerp = (a, b, k) => a + (b - a) * k;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const ctx = document.createElement("canvas").getContext("2d");
const textW = (s, font) => { ctx.font = font; return ctx.measureText(s).width; };

// ---------- Терминал ----------
const TX = 32, TY = 32, TW = 640, TH = 456;
const LH = 30, CW = 10.8, FONT_PX = 18;
const X0 = TX + 28, Y0 = TY + 44 + 34, VISIBLE = 12;
const LINES = [];
STEPS.forEach((s, i) => {
  LINES.push({ kind: "cmd", step: i, at: i === 0 ? 0 : STEPS[i - 1].enter + 0.12 + STEPS[i - 1].out.length * 0.06 });
  s.out.forEach((tok, k) => LINES.push({ kind: "out", tokens: tok, at: s.enter + 0.05 + k * 0.06 }));
});
const last = STEPS[STEPS.length - 1];
LINES.push({ kind: "final", at: last.enter + 0.12 + last.out.length * 0.06 });

function tspans(tokens, limit = Infinity) {
  let out = "", used = 0;
  for (const [txt, col] of tokens) {
    if (used >= limit) break;
    const part = txt.slice(0, Math.max(0, limit - used));
    used += part.length;
    out += `<tspan fill="${T[col]}">${esc(part)}</tspan>`;
  }
  return out;
}

function terminal(t, fade) {
  let s = `<rect x="${TX}" y="${TY}" width="${TW}" height="${TH}" rx="16" fill="${C.term}" stroke="${C.termBorder}"/>`;
  ["red", "yellow", "green"].forEach((c, i) => {
    s += `<circle cx="${TX + 26 + i * 22}" cy="${TY + 22}" r="6.5" fill="${T[c]}"/>`;
  });
  s += `<text x="${TX + TW / 2}" y="${TY + 27}" text-anchor="middle" font-size="15" fill="${T.muted}">PowerShell — C:\\demo</text>`;
  s += `<line x1="${TX}" y1="${TY + 44}" x2="${TX + TW}" y2="${TY + 44}" stroke="${C.termLine}"/>`;

  const shown = LINES.filter((l) => t >= l.at);
  let scroll = 0;
  LINES.forEach((l, j) => { if (j >= VISIBLE) scroll += LH * outCubic(prog(t, l.at, 0.18)); });
  s += `<clipPath id="tc"><rect x="${TX}" y="${TY + 52}" width="${TW}" height="${TH - 60}"/></clipPath>`;
  s += `<g clip-path="url(#tc)" opacity="${fade}"><g transform="translate(0 ${-scroll})">`;
  let cursor = null;
  const intro = prog(t, 0, 0.3);
  shown.forEach((l, j) => {
    const y = Y0 + j * LH;
    if (l.kind === "out") {
      s += `<text class="m" x="${X0}" y="${y}" font-size="${FONT_PX}" opacity="${prog(t, l.at, 0.12)}">${tspans(l.tokens)}</text>`;
      return;
    }
    const step = l.kind === "cmd" ? STEPS[l.step] : null;
    let typed = 0;
    if (step) typed = step.charT.filter((c) => c <= t).length;
    const tokens = PROMPT.concat(step ? step.cmd : []);
    const op = j === 0 ? intro : 1;
    s += `<text class="m" x="${X0}" y="${y}" font-size="${FONT_PX}" opacity="${op}">${tspans(tokens, PROMPT[0][0].length + typed)}</text>`;
    const typing = step && t >= step.start && t < step.enter;
    const waiting = !step || t < step.enter;
    if (waiting) cursor = { x: X0 + (PROMPT[0][0].length + typed) * CW, y, solid: typing, since: step ? step.start : l.at, op };
  });
  if (cursor) {
    const on = cursor.solid || Math.floor((t - cursor.since) / 0.5) % 2 === 0;
    if (on) s += `<rect x="${cursor.x + 1}" y="${cursor.y - 16}" width="${CW - 1}" height="21" rx="1.5" fill="${T.fg}" opacity="${0.85 * cursor.op}"/>`;
  }
  s += "</g></g>";
  return s;
}

// ---------- Граф коммитов ----------
const MAIN_Y = 380, FEAT_Y = 292;
const X = { c1: 800, f1: 925, c2: 1030, m: 1150 };
const REM = { x: 736, y: 32, w: 512, h: 150, mainY: 152, featY: 120 };
const PATHS = {
  branch: `M${X.c1},${MAIN_Y} C${X.c1 + 60},${MAIN_Y} ${X.f1 - 60},${FEAT_Y} ${X.f1},${FEAT_Y}`,
  main1: `M${X.c1},${MAIN_Y} L${X.c2},${MAIN_Y}`,
  main2: `M${X.c2},${MAIN_Y} L${X.m},${MAIN_Y}`,
  merge: `M${X.f1},${FEAT_Y} C${X.f1 + 135},${FEAT_Y} ${X.m - 70},${MAIN_Y} ${X.m},${MAIN_Y}`,
  push: `M${X.m + 6},${MAIN_Y - 18} C${X.m + 78},${MAIN_Y - 60} ${X.m + 78},${REM.mainY + 50} ${X.m + 6},${REM.mainY + 16}`,
  rBranch: `M${X.c1},${REM.mainY} C${X.c1 + 50},${REM.mainY} ${X.f1 - 50},${REM.featY} ${X.f1},${REM.featY}`,
  rMain1: `M${X.c1},${REM.mainY} L${X.c2},${REM.mainY}`,
  rMain2: `M${X.c2},${REM.mainY} L${X.m},${REM.mainY}`,
  rMerge: `M${X.f1},${REM.featY} C${X.f1 + 120},${REM.featY} ${X.m - 60},${REM.mainY} ${X.m},${REM.mainY}`,
};
const measure = document.createElementNS("http://www.w3.org/2000/svg", "path");
measure.setAttribute("fill", "none");
document.getElementById("s").appendChild(measure);
const LEN = {};
for (const [k, d] of Object.entries(PATHS)) { measure.setAttribute("d", d); LEN[k] = measure.getTotalLength(); }
function pointAt(key, k) { measure.setAttribute("d", PATHS[key]); const p = measure.getPointAtLength(LEN[key] * k); return [p.x, p.y]; }

function stroke(key, k, color, width, extra = "") {
  if (k <= 0) return "";
  return `<path d="${PATHS[key]}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" ` +
    `stroke-dasharray="${LEN[key]}" stroke-dashoffset="${LEN[key] * (1 - k)}" ${extra}/>`;
}
function commit(x, y, k, color, r = 14, merge = false) {
  if (k <= 0) return "";
  const rr = r * outBack(k);
  let s = `<circle cx="${x}" cy="${y}" r="${rr}" fill="${color}" stroke="${C.page}" stroke-width="4"/>`;
  if (merge) s += `<circle cx="${x}" cy="${y}" r="${rr * 0.4}" fill="${C.page}"/>`;
  return s;
}
function pill(cx, cy, label, fill, color, op = 1, mono = false, outline = false) {
  if (op <= 0) return "";
  const font = mono ? `500 13px "Roboto Mono"` : `500 14px Roboto`;
  const w = textW(label, font) + 22, h = 26;
  const rect = outline
    ? `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${C.page}" stroke="${fill}" stroke-width="1.5"/>`
    : `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}"/>`;
  return `<g opacity="${op}">${rect}<text ${mono ? 'class="m" ' : ""}x="${cx}" y="${cy + 5}" text-anchor="middle" ` +
    `font-size="${mono ? 13 : 14}" font-weight="500" fill="${color}">${esc(label)}</text></g>`;
}
const pillW = (label) => textW(label, "500 14px Roboto") + 22;
const headW = textW("HEAD", `500 13px "Roboto Mono"`) + 22;

function graph(t, fade) {
  let s = "";
  // Локальный репозиторий появляется после git init
  const repo = prog(t, E[0], 0.4) * fade;
  s += `<g opacity="${repo}">` +
    `<path d="M736,214 h14 l4,5 h18 v16 h-36 z" fill="none" stroke="${C.muted}" stroke-width="1.6" stroke-linejoin="round"/>` +
    `<text x="782" y="232" font-size="15" fill="${C.muted}">Локальный репозиторий · C:\\demo</text>` +
    `<line x1="760" y1="${MAIN_Y}" x2="1210" y2="${MAIN_Y}" stroke="${C.border}" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/></g>`;

  s += `<g opacity="${fade}">`;
  // Линии
  s += stroke("branch", inOut(prog(t, E[4], 0.35)), C.green, 5);
  s += stroke("main1", inOut(prog(t, E[6], 0.35)), C.blue, 5);
  s += stroke("merge", inOut(prog(t, E[7], 0.4)), C.green, 5);
  s += stroke("main2", inOut(prog(t, E[7], 0.4)), C.blue, 5);
  // Индекс: появляется после git add, «превращается» в коммит
  const chipIn = prog(t, E[1], 0.3), chipGo = inOut(prog(t, E[2], 0.35));
  if (chipIn > 0 && chipGo < 1) {
    const cx = lerp(880, X.c1, chipGo), cy = lerp(316, MAIN_Y, chipGo), sc = lerp(1, 0.2, chipGo) * outBack(chipIn);
    const label = "индекс · 2 файла", w = textW(label, "500 14px Roboto") + 46;
    s += `<g transform="translate(${cx} ${cy}) scale(${sc})" opacity="${1 - chipGo * 0.7}">` +
      `<rect x="${-w / 2}" y="-16" width="${w}" height="32" rx="16" fill="${C.card}" stroke="${C.border}"/>` +
      `<path d="M${-w / 2 + 14},-8 h8 l4,4 v12 h-12 z" fill="none" stroke="${C.yellow}" stroke-width="1.6" stroke-linejoin="round"/>` +
      `<text x="${-w / 2 + 34}" y="5" font-size="14" font-weight="500" fill="${C.text}">${label}</text></g>`;
  }
  // Коммиты
  s += commit(X.c1, MAIN_Y, prog(t, E[2], 0.45), C.blue);
  s += commit(X.f1, FEAT_Y, prog(t, E[4] + 0.25, 0.45), C.green);
  s += commit(X.c2, MAIN_Y, prog(t, E[6] + 0.25, 0.45), C.blue);
  s += commit(X.m, MAIN_Y, prog(t, E[7] + 0.3, 0.45), C.blue, 15, true);

  // Указатели веток
  const mainX = t < E[6] ? X.c1 : t < E[7] ? lerp(X.c1, X.c2, inOut(prog(t, E[6] + 0.2, 0.35)))
    : lerp(X.c2, X.m, inOut(prog(t, E[7] + 0.25, 0.35)));
  const mainOp = prog(t, E[2] + 0.15, 0.3);
  const mainP = [mainX, MAIN_Y + 36];
  const fk = inOut(prog(t, E[4] + 0.2, 0.35));
  const featP = [lerp(X.c1, X.f1, fk), lerp(MAIN_Y - 36, FEAT_Y - 36, fk)];
  const featOp = prog(t, E[3], 0.3);
  s += pill(...featP, "feature", C.green, C.onPill, featOp);
  s += pill(...mainP, "main", C.blue, C.onPill, mainOp);
  // HEAD стоит слева от текущей ветки
  const headAt = (p, label) => [p[0] - pillW(label) / 2 - 8 - headW / 2, p[1]];
  const onMain = headAt(mainP, "main"), onFeat = headAt(featP, "feature");
  let hp;
  if (t < E[3]) hp = onMain;
  else if (t < E[5]) { const k = inOut(prog(t, E[3], 0.35)); hp = [lerp(onMain[0], onFeat[0], k), lerp(onMain[1], onFeat[1], k)]; }
  else { const k = inOut(prog(t, E[5], 0.35)); hp = [lerp(onFeat[0], onMain[0], k), lerp(onFeat[1], onMain[1], k)]; }
  s += pill(...hp, "HEAD", C.muted, C.muted, mainOp, true, true);
  s += "</g>";
  return s;
}

// ---------- Удалённый репозиторий ----------
function remote(t, fade) {
  const r = REM;
  let s = `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="16" fill="${C.card}" stroke="${C.border}"/>`;
  s += `<path d="M770,82 h-12 a10,10 0 0 1 -1,-20 a14,14 0 0 1 27,-5 a10,10 0 0 1 4,25 z" transform="translate(0 -6)" fill="none" stroke="${C.muted}" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<text x="806" y="66" font-size="20" font-weight="700" fill="${C.text}">GitHub</text>`;
  s += `<text x="806" y="88" font-size="14" fill="${C.muted}">origin · удалённый репозиторий</text>`;
  s += `<line x1="760" y1="${r.mainY}" x2="1210" y2="${r.mainY}" stroke="${C.border}" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>`;

  const push = E[8];
  const arrive = [0, 1, 2, 3].map((k) => push + 0.15 + k * 0.17 + 0.6);
  const done = arrive[3] + 0.25;
  // Пунктир пути и «пакеты» коммитов
  const guide = prog(t, push, 0.25) * (1 - prog(t, done + 0.4, 0.4)) * fade;
  if (guide > 0) {
    s += `<path d="${PATHS.push}" fill="none" stroke="${C.muted}" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round" opacity="${guide * 0.8}"/>`;
  }
  const colors = [C.blue, C.green, C.blue, C.blue];
  colors.forEach((col, k) => {
    const st = push + 0.15 + k * 0.17, p = prog(t, st, 0.6);
    if (p > 0 && p < 1) {
      const [x, y] = pointAt("push", inOut(p));
      s += `<circle cx="${x}" cy="${y}" r="7" fill="${col}" opacity="${fade}"/>`;
    }
  });
  // Мини-граф на GitHub
  s += `<g opacity="${fade}">`;
  s += stroke("rBranch", inOut(prog(t, arrive[1], 0.25)), C.green, 3);
  s += stroke("rMain1", inOut(prog(t, arrive[2], 0.25)), C.blue, 3);
  s += stroke("rMerge", inOut(prog(t, arrive[3], 0.3)), C.green, 3);
  s += stroke("rMain2", inOut(prog(t, arrive[3], 0.3)), C.blue, 3);
  s += commit(X.c1, r.mainY, prog(t, arrive[0], 0.35), C.blue, 8);
  s += commit(X.f1, r.featY, prog(t, arrive[1], 0.35), C.green, 8);
  s += commit(X.c2, r.mainY, prog(t, arrive[2], 0.35), C.blue, 8);
  s += commit(X.m, r.mainY, prog(t, arrive[3], 0.35), C.blue, 9, true);
  s += `</g>`;
  // Состояние
  const ok = prog(t, done, 0.3) * fade;
  const empty = 1 - ok;
  s += pill(1224 - pillW("пусто") / 2, 60, "пусто", C.muted, C.muted, empty, false, true);
  const okLabel = "✓ отправлено";
  s += pill(1224 - pillW(okLabel) / 2, 60, okLabel, C.green, C.onPill, ok);
  return s;
}

// ---------- Подпись шага ----------
function caption(t, fade) {
  if (MODE === "social") return "";
  let idx = -1;
  STEPS.forEach((st, i) => { if (t >= st.start - 0.15) idx = i; });
  const finalAt = E[8] + 0.15 + 3 * 0.17 + 0.6 + 0.25;
  const fin = t >= finalAt;
  if (idx < 0) return "";
  const at = fin ? finalAt : STEPS[idx].start - 0.15;
  const k = outCubic(prog(t, at, 0.3));
  const col = fin ? C.green : C[STEP_COLORS[idx % 4]];
  const text = fin ? "Готово: проект на GitHub" : STEPS[idx].caption;
  const num = fin ? "✓" : String(idx + 1);
  const y = 478 + (1 - k) * 8;
  let s = `<g opacity="${k * fade}">`;
  s += `<circle cx="750" cy="${y - 6}" r="14" fill="${col}"/>`;
  s += `<text x="750" y="${y - 1}" text-anchor="middle" font-size="14" font-weight="700" fill="${col === C.yellow && THEME === "light" ? C.text : C.onPill}">${num}</text>`;
  s += `<text x="776" y="${y}" font-size="19" font-weight="500" fill="${C.text}">${esc(text)}</text>`;
  if (!fin) s += `<text x="1248" y="${y}" text-anchor="end" font-size="14" fill="${C.muted}">шаг ${idx + 1} из ${STEPS.length}</text>`;
  s += "</g>";
  return s;
}

// ---------- Картинка для соцсетей ----------
function social() {
  const bar = ["blue", "red", "yellow", "green"].map((c, i) => `<rect x="${i * W / 4}" y="0" width="${W / 4}" height="8" fill="${C[c]}"/>`).join("");
  return bar +
    `<text x="72" y="214" font-size="76" font-weight="700" fill="${C.text}">Git и GitHub</text>` +
    `<text x="72" y="304" font-size="76" font-weight="700" fill="${C.blue}">с нуля</text>` +
    `<text x="72" y="372" font-size="26" fill="${C.muted}">Методичка для начинающих: от первого</text>` +
    `<text x="72" y="408" font-size="26" fill="${C.muted}">коммита до профессионального репозитория</text>` +
    `<text x="72" y="492" font-size="20" font-weight="500" fill="${C.text}">11 глав · 25 схем · шаблоны · PDF</text>` +
    `<text class="m" x="72" y="584" font-size="18" fill="${C.muted}">github.com/RuslanKazyradzi13/git-github-guide</text>`;
}

window.render = function (t) {
  const fade = 1 - prog(t, ACT_END + HOLD, FADE);
  let s = `<rect width="${W}" height="${H}" fill="${C.page}"/>`;
  if (MODE === "social") {
    s += social();
    s += `<g transform="translate(0 72)">${remote(t, 1)}${graph(t, 1)}</g>`;
  } else {
    s += terminal(t, fade) + remote(t, fade) + graph(t, fade) + caption(t, fade);
  }
  const svg = document.getElementById("s");
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = s;
  svg.appendChild(measure);
  return new Promise((res) => requestAnimationFrame(() => requestAnimationFrame(res)));
};

window.ready = false;
document.fonts.ready.then(async () => {
  await Promise.all(["400 18px 'Roboto Mono'", "500 14px Roboto", "700 20px Roboto"].map((f) => document.fonts.load(f, "Ая")));
  await window.render(MODE === "social" ? ACT_END + 0.5 : 0);
  window.ready = true;
  // hero.html?play — проиграть анимацию прямо в браузере
  if (P.has("play") && MODE === "anim") {
    const t0 = performance.now();
    const tick = async () => { await window.render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(tick); };
    tick();
  }
});
</script>
</body>
